<!DOCTYPE html>
<html lang="en" data-accent="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1F7">
<title>Recomp — Master</title>
<style>
:root{
  /* calm palette, matched to the printed Master Panduan: sage, dusty blue, sand, clay, lavender */
  --bg:#F1F4F2; --card:#FFFFFF; --card2:#F5F8F6; --card3:#E9EFEB;
  --line:#E0E7E2; --line2:#D0DAD3;
  --ink:#17211D; --ink2:#52615A; --ink3:#86948D;
  --pri:#3D7C67; --pri-soft:#E2EFE9; --pri-ink:#2B5D4D; --on-pri:#FFFFFF;
  --pro:#4A8D6D; --carb:#C29448; --fat:#7C76B3; --water:#4886AA;
  --ok:#4A8D6D; --warn:#C7883B; --bad:#C05E4C; --on-ok:#FFFFFF;
  --sh:0 1px 2px rgba(20,32,26,.04),0 3px 10px rgba(20,32,26,.05);
  --sh2:0 6px 20px rgba(20,32,26,.13);
  --r:16px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
[data-theme="dark"]{
  --bg:#0D1210; --card:#151B18; --card2:#1A221F; --card3:#212A26;
  --line:#25302B; --line2:#2F3A35;
  --ink:#E6ECE9; --ink2:#9EABA5; --ink3:#71807A;
  --pri:#7AB89D; --pri-soft:#172720; --pri-ink:#A5D4BF; --on-pri:#0C1612;
  --pro:#6CBC92; --carb:#D6AD66; --fat:#A39CD6; --water:#6DADD0;
  --ok:#6CBC92; --warn:#DBA25A; --bad:#DE7C68; --on-ok:#0C1612;
  --sh:0 1px 2px rgba(0,0,0,.35); --sh2:0 6px 22px rgba(0,0,0,.45);
}
/* the classic blue accent stays available in More → Settings → Display */
[data-accent="blue"]{--pri:#1668E3;--pri-soft:#E9F1FE;--pri-ink:#0F4FAD;--on-pri:#FFFFFF}
[data-theme="dark"][data-accent="blue"]{--pri:#5B9BF0;--pri-soft:#16273F;--pri-ink:#8FBBF6;--on-pri:#0B1626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);overscroll-behavior-y:none}
body{
  font-family:var(--sys);font-size:16px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(66px + var(--sb));
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
a{color:var(--pri);text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:calc(var(--st) + 8px) 14px 10px}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.bar-sub{font-size:11.5px;color:var(--ink3);margin-top:-1px}
.bar-top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--card2)}
.ib:active{background:var(--card3)}
.srch{position:relative}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
#q{width:100%;height:40px;padding:0 36px 0 34px;background:var(--card2);border:1px solid var(--line);border-radius:11px;font-size:15px}
#q::placeholder{color:var(--ink3)}
#qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;color:var(--ink3);display:none;place-items:center;font-size:19px}
#qx.on{display:grid}

main{max-width:620px;margin:0 auto;padding:12px 12px 16px}
.view{display:none}.view.on{display:block}

/* ---------- cards ---------- */
.c{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.c-p{padding:15px}
.c-h{display:flex;align-items:center;gap:8px;padding:13px 15px 0}
.c-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.c-h .sp{flex:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--ink3);line-height:1.45}
.hr{height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

/* ---------- date nav ---------- */
.dnav{display:flex;align-items:center;background:var(--card);border-radius:12px;box-shadow:var(--sh);margin-bottom:12px;padding:4px}
.dnav button{width:46px;height:44px;border-radius:9px;color:var(--pri);font-size:21px;display:grid;place-items:center}
.dnav button:disabled{color:var(--ink3);opacity:.35}
.dnav .mid{flex:1;text-align:center;position:relative}
.dnav .d1{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.dnav .d2{font-size:11.5px;color:var(--ink3)}
.dnav input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none}

/* ---------- calorie hero (MFP-style) ---------- */
.hero{padding:16px 15px 14px}
.hero-top{display:flex;align-items:center;gap:16px}
.hero-r{flex:0 0 auto}
.hero-i{flex:1;min-width:0}
.hero-big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.hero-lb{font-size:12.5px;color:var(--ink2);margin-top:3px}
.eq{display:flex;align-items:flex-start;margin-top:14px;gap:2px}
.eq-i{flex:1 1 0;min-width:0;text-align:center}
.eq-o{flex:0 0 13px;text-align:center;font-size:14px;color:var(--ink3);padding-top:2px}
.eq-v{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.eq-l{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- macro strip ---------- */
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:13px 15px 15px;border-top:1px solid var(--line)}
.mac-i{min-width:0}
.mac-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px;margin-bottom:5px}
.mac-n{font-size:11.5px;font-weight:600;color:var(--ink2)}
.mac-v{font-size:11px;color:var(--ink3);white-space:nowrap}
.trk{height:6px;border-radius:4px;background:var(--card3);overflow:hidden}
.trk i{display:block;height:100%;border-radius:4px;transition:width .45s cubic-bezier(.34,1.2,.64,1)}

/* ---------- range bar (no absolute labels = no overlap) ---------- */
.rb{padding:13px 15px}
.rb+.rb{border-top:1px solid var(--line)}
.rb-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.rb-n{font-size:14px;font-weight:600}
.rb-h .sp{flex:1}
.rb-v{font-size:16px;font-weight:700;letter-spacing:-.3px}
.rb-u{font-size:11.5px;color:var(--ink3);font-weight:500;margin-left:2px}
.rb-t{position:relative;height:9px;border-radius:5px;background:var(--card3);overflow:hidden}
.rb-band{position:absolute;top:0;bottom:0;background:rgba(46,158,104,.16)}
.rb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .45s cubic-bezier(.34,1.2,.64,1)}
.rb-tick{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--card);opacity:.9}
.rb-legend{display:flex;margin-top:8px;gap:4px}
.rb-legend div{flex:1 1 0;min-width:0;text-align:center}
.rb-legend b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.2px}
.rb-legend span{display:block;font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-note{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.45}

/* ---------- meal rows ---------- */
.meal-h{display:flex;align-items:center;gap:8px;padding:12px 15px 8px}
.meal-h .n{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.meal-h .sp{flex:1}
.meal-h .k{font-size:13px;color:var(--ink3);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--line)}
.it:active{background:var(--card2)}
.it .m{flex:1;min-width:0}
.it .t1{font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t2{font-size:11.5px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .r{font-size:14.5px;font-weight:600;text-align:right;flex:0 0 auto}
.it .r small{display:block;font-size:10px;color:var(--ink3);font-weight:400}
.addrow{display:flex;align-items:center;gap:7px;padding:11px 15px;border-top:1px solid var(--line);color:var(--pri);font-size:13.5px;font-weight:600;width:100%}
.addrow:active{background:var(--pri-soft)}
.alpha{padding:6px 15px;background:var(--card2);font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.08em;border-top:1px solid var(--line)}

/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink)}
.b:active{background:var(--card3)}
.b.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.b.pri:active{filter:brightness(.92)}
.b.dan{color:var(--bad);border-color:rgba(216,84,74,.32)}
.b.full{width:100%}
.b.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.brow{display:flex;gap:8px}.brow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:36px;padding:0 13px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center}
.chip:active{background:var(--card3)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.w{color:var(--water);border-color:rgba(39,149,201,.3)}
.seg{display:flex;background:var(--card3);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

/* ---------- fields ---------- */
.f{margin-bottom:13px}
.f>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.in,select.in,textarea.in{width:100%;min-height:46px;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:11px;font-size:16px}
.in:focus{border-color:var(--pri);outline:none;background:var(--card)}
textarea.in{min-height:76px;resize:vertical}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.stp{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card2)}
.stp button{width:46px;flex:0 0 auto;background:var(--card3);color:var(--ink2);font-size:21px;font-weight:400}
.stp button:active{background:var(--pri);color:var(--on-pri)}
.stp .in{border:none;border-radius:0;text-align:center;background:transparent;min-height:46px}
.stp .sfx{display:flex;align-items:center;padding:0 11px;color:var(--ink3);font-size:12.5px;background:var(--card3)}

/* ---------- stat tiles ---------- */
.st{background:var(--card2);border-radius:11px;padding:11px}
.st .k{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.st .d{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.ch-h{display:flex;align-items:baseline;gap:8px;padding:13px 15px 4px}
.ch-h .t{font-size:14px;font-weight:700}
.ch-h .sp{flex:1}
.ch-h .a{font-size:11.5px;color:var(--ink3)}
.ch-b{padding:2px 8px 10px}
.ch-lg{display:flex;gap:12px;padding:0 15px 12px;flex-wrap:wrap}
.ch-lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.ch-lg span{font-size:11px;color:var(--ink3)}
.ch-read{display:flex;align-items:baseline;gap:8px;padding:0 15px 6px;min-height:20px}
.ch-read b{font-size:15px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.ch-read span{font-size:11.5px;color:var(--ink3)}
.ch-read .hint{margin-left:auto;font-size:10.5px;color:var(--ink3);opacity:.8}
.chart{touch-action:pan-y}
.cx-line{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.cx-dot{pointer-events:none}

/* ---------- flags / notes ---------- */
.flag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.flag.ok{background:rgba(46,158,104,.12);color:var(--ok)}
.flag.wa{background:rgba(217,138,60,.13);color:var(--warn)}
.flag.ba{background:rgba(216,84,74,.12);color:var(--bad)}
.flag.in{background:var(--pri-soft);color:var(--pri-ink)}
.note{background:var(--card2);border-radius:10px;padding:11px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.note.wa{background:rgba(217,138,60,.09)}
.note b{color:var(--ink)}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty b{display:block;color:var(--ink2);font-size:14.5px;font-weight:700;margin-bottom:5px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);display:flex;padding:5px 2px calc(4px + var(--sb));max-width:620px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 2px;color:var(--ink3);min-height:48px}
.nav button.on{color:var(--pri)}
.nav .l{font-size:10px;font-weight:600;letter-spacing:-.1px}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--sb));z-index:55;width:54px;height:54px;border-radius:18px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;box-shadow:var(--sh2)}
.fab:active{filter:brightness(.92)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,34,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 15px calc(20px + var(--sb));transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;background:var(--line2);border-radius:3px;margin:8px auto 0}
.sh-h{position:sticky;top:0;background:var(--card);padding:11px 0 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px;z-index:3}
.sh-h h3{margin:0;font-size:17px;font-weight:700}
.sh-h .sp{flex:1}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,12px);z-index:120;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{position:relative;width:50px;height:30px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--card3);border-radius:16px;transition:.24s}
.sw i:before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.24s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i:before{transform:translateX(20px)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
table.tb th:first-child{text-align:left}
table.tb td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.tb td:first-child{text-align:left;font-variant-numeric:normal}
.badge{background:var(--card2);border-radius:11px;padding:11px 6px;text-align:center}
.badge .e{font-size:23px;line-height:1.2}
.badge .n{font-size:9.5px;color:var(--ink3);margin-top:3px;line-height:1.25}
.paper{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:9px;border-left:3px solid var(--pri)}
.paper .a{font-size:14px;font-weight:700}
.paper .i{font-size:11.5px;color:var(--pri-ink);margin:2px 0 6px}
.paper .f{font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ---------- lifting logger ---------- */
.wsum{display:flex;gap:4px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.wsum div{flex:1;min-width:0;text-align:center}
.wsum b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.wsum span{display:block;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.exb{border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;background:var(--card)}
.exb-h{display:flex;align-items:center;gap:9px;padding:11px 12px 8px}
.exb-h .nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--pri);line-height:1.25}
.exb-h .mn{width:32px;height:32px;border-radius:8px;color:var(--ink3);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.exb-meta{display:flex;align-items:center;gap:8px;padding:0 12px 9px;flex-wrap:wrap}
.ss-tag{color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;letter-spacing:.02em}
.exb.ssg{border-left:3px solid var(--ssc)}
.stype{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;margin:0 auto;
  background:var(--card3);color:var(--ink2)}
.stype.W{background:rgba(219,155,42,.18);color:var(--carb)}
.stype.D{background:rgba(129,85,214,.18);color:var(--fat)}
.stype.F{background:rgba(216,84,74,.18);color:var(--bad)}
.exb.cardio .nm{color:var(--water)}
.cblk{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px 12px}
.rest-btn{font-size:12px;color:var(--pri);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.sgrid{display:grid;grid-template-columns:30px minmax(44px,1fr) 58px 58px 38px;align-items:center;gap:6px;padding:0 12px}
.sgrid.tm{grid-template-columns:30px minmax(36px,1fr) 50px 78px 38px}
.srow input.tin{font-size:15px;letter-spacing:-.3px}
.kindbar{display:flex;gap:6px;padding:0 12px 10px}
.kindbar button{flex:1;min-height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2)}
.kindbar button.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.swp{position:relative;overflow:hidden}
.swp-del{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700}
.swp-in{position:relative;background:var(--card);transition:transform .2s cubic-bezier(.32,.72,0,1);touch-action:pan-y;will-change:transform}
.srow.swp-in.done{background:rgba(46,158,104,.13)}
[data-theme="dark"] .srow.swp-in.done{background:rgba(46,158,104,.16)}
.swp.open .swp-in{transform:translateX(-96px)}
.swp-hint{font-size:11px;color:var(--ink3);text-align:center;padding:7px 0 3px}
.sgrid.hd{padding-top:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sgrid.hd span{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrid.hd span:nth-child(2){text-align:left}
.srow{min-height:46px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:none}
.srow.done{background:rgba(46,158,104,.13)}
[data-theme="dark"] .srow.done{background:rgba(46,158,104,.16)}
.srow .n{font-size:14px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.srow .pv{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow input{width:100%;min-height:36px;padding:0 4px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-radius:8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.srow.done input{background:transparent;border-color:transparent}
.srow input:focus{border-color:var(--pri);background:var(--card);outline:none}
.tick{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;
  color:transparent;background:var(--card2);margin:0 auto}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.exb-add{width:100%;padding:11px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--card2);border-top:1px solid var(--line)}
.exb-add:active{background:var(--card3)}
.rest-bar{position:sticky;bottom:0;z-index:5;background:var(--pri);color:var(--on-pri);border-radius:12px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;margin-top:10px;box-shadow:var(--sh2)}
.rest-bar b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.rest-bar span{flex:1;font-size:12.5px;opacity:.9}
.rest-bar button{color:var(--on-pri);font-size:12.5px;font-weight:700;padding:7px 11px;border:1px solid rgba(255,255,255,.45);border-color:color-mix(in srgb,var(--on-pri) 45%,transparent);border-radius:8px}
.draft{display:flex;align-items:center;gap:11px;background:var(--pri-soft);border:1px solid var(--pri);
  border-radius:12px;padding:12px 14px;margin-bottom:12px}
.draft .d1{font-size:14px;font-weight:700;color:var(--pri-ink)}
.draft .d2{font-size:11.5px;color:var(--ink2);margin-top:1px}

/* =================== master update: calm palette extras =================== */
.bar{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nav{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nav .ico{display:grid;place-items:center;width:54px;height:29px;border-radius:15px;transition:background .2s,color .2s}
.nav button.on .ico{background:var(--pri-soft);color:var(--pri)}
.nav button.on .l{color:var(--pri);font-weight:700}
[data-theme="dark"] .c,[data-theme="dark"] .dnav{box-shadow:none;border:1px solid var(--line)}
.rb-band{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.b.dan{border-color:color-mix(in srgb,var(--bad) 32%,transparent)}
.chip.w{border-color:color-mix(in srgb,var(--water) 30%,transparent)}
.flag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.flag.wa{background:color-mix(in srgb,var(--warn) 15%,transparent)}
.flag.ba{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.note.wa{background:color-mix(in srgb,var(--warn) 11%,var(--card2))}
.stype.W{background:color-mix(in srgb,var(--carb) 18%,transparent)}
.stype.D{background:color-mix(in srgb,var(--fat) 18%,transparent)}
.stype.F{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.srow.done,.srow.swp-in.done{background:color-mix(in srgb,var(--ok) 14%,transparent)}
[data-theme="dark"] .srow.done,[data-theme="dark"] .srow.swp-in.done{background:color-mix(in srgb,var(--ok) 17%,transparent)}
.sw.sm{width:42px;height:25px}.sw.sm i{border-radius:13px}.sw.sm i:before{width:21px;height:21px}
.sw.sm input:checked + i:before{transform:translateX(17px)}
/* today card */
.today .tp{display:flex;align-items:center;gap:8px;padding:13px 15px 0}
.today .tp h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.next{margin:11px 15px 0;padding:11px 13px;border-radius:13px;background:var(--pri-soft);display:flex;gap:11px;align-items:center;cursor:pointer}
.next .ic{width:38px;height:38px;border-radius:12px;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;flex:0 0 auto}
.next .t{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pri-ink)}
.next .n{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.25;margin-top:1px}
.next .d{font-size:12px;color:var(--ink2);margin-top:1px}
.tl{display:flex;gap:8px;overflow-x:auto;padding:12px 15px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tl button{flex:0 0 auto;width:92px;scroll-snap-align:start;text-align:left;padding:8px 10px 9px;border-radius:12px;background:var(--card2);border:1px solid var(--line);position:relative}
.tl .tm{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tl .lb{font-size:11.5px;color:var(--ink2);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl .ic2{position:absolute;right:8px;top:8px;color:var(--ink3);display:grid}
.tl button.done{background:color-mix(in srgb,var(--ok) 11%,var(--card2));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.tl button.done .ic2,.tl button.done .tm{color:var(--ok)}
.tl button.now{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.tl button.now .tm{color:var(--pri)}
.tl button.miss{opacity:.5}
.btls{display:flex;gap:6px;align-items:flex-end;padding:10px 15px 14px}
.btl{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:4px 0;border-radius:10px}
.btl:active{background:var(--card2)}
.btl svg{display:block}
.btl .bt{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.btl.full .bt{color:var(--water);font-weight:700}
.btl.wtot{flex:1.6;align-items:flex-start;justify-content:flex-end;padding-left:6px}
.btl.wtot b{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--water)}
.actb{display:block;width:100%;text-align:left;margin-top:13px;padding:12px 0 0;border-top:1px solid var(--line)}
/* meals */
.qm{display:flex;gap:7px;flex-wrap:wrap;padding:0 15px 11px}
.qm button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;font-size:12.5px;font-weight:600;color:var(--pri-ink);background:var(--pri-soft);border:1px dashed color-mix(in srgb,var(--pri) 45%,transparent)}
.mt{font-size:11.5px;color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums}
.meal-h .mt{margin-left:2px}
/* guide */
.gtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.gt{background:var(--card2);border-radius:12px;padding:10px 12px 11px;border-top:3px solid var(--pri)}
.gt .v{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.gt .v small{font-size:12px;font-weight:600;color:var(--ink3);margin-left:3px;letter-spacing:0}
.gt .k{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.gt .d{font-size:11.5px;color:var(--ink2);margin-top:1px;line-height:1.35}
.do,.dont,.ck{margin:0 0 10px;padding:0}
.do li,.dont li,.ck li{margin:0 0 7px;padding-left:22px;position:relative;font-size:13px;line-height:1.45;color:var(--ink2);list-style:none}
.do li:before{content:"✓";position:absolute;left:2px;top:0;color:var(--ok);font-weight:800}
.dont li:before{content:"✕";position:absolute;left:2px;top:0;color:var(--bad);font-weight:800}
.ck li:before{content:"○";position:absolute;left:2px;top:0;color:var(--pri);font-weight:800}
.do b,.dont b,.ck b{color:var(--ink)}
.nl{margin:0;padding:0;counter-reset:n}
.nl li{list-style:none;counter-increment:n;position:relative;padding-left:29px;margin-bottom:8px;font-size:13px;line-height:1.45;color:var(--ink2)}
.nl li:before{content:counter(n);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--fat);color:var(--on-pri);font-size:11px;font-weight:800;display:grid;place-items:center}
.nl b{color:var(--ink)}
.avoid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.av{background:color-mix(in srgb,var(--bad) 9%,var(--card2));border-radius:11px;padding:9px 11px 10px}
.av .n{font-size:13px;font-weight:700}
.av .w{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.steps-o{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.steps-o span{display:inline-flex;align-items:center;padding:5px 10px;border-radius:15px;background:var(--card2);font-size:12.5px;font-weight:600}
.steps-o i{font-style:normal;color:var(--ink3)}
.pbar{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:9px;align-items:center;margin-bottom:8px;font-size:12.5px;line-height:1.25}
.pbar .t{height:10px;border-radius:5px;background:var(--card3);overflow:hidden}
.pbar .t i{display:block;height:100%;border-radius:5px}
.pbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 4px}
.pat>div{text-align:center;min-width:0}
.pat .dl{font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.pat .pp{font-size:10px;letter-spacing:-.2px;font-weight:800;border-radius:8px;padding:7px 1px;color:var(--on-pri);background:var(--pro);white-space:nowrap;overflow:hidden}
.pat .pp.h{background:var(--bad)}.pat .pp.z{background:var(--water)}.pat .pp.r{background:var(--carb)}
.srules>div{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
.srules>div:first-child{border-top:none}
.srules i{width:9px;height:9px;border-radius:50%}
.srules b{font-size:12.5px;text-align:right}
.daud{background:color-mix(in srgb,var(--fat) 8%,var(--card))}
.flag.in{width:auto;min-height:0;border:none}
input[type=checkbox]{accent-color:var(--pri)}
.stp button{width:40px}
.stp .in{min-width:0;flex:1 1 auto;padding-left:4px;padding-right:4px}
.stp .sfx{padding:0 8px;font-size:12px}
#btnTheme svg{display:block}

/* =================== stage 5 — dashboard look (MyFitnessPal / FatSecret inspired), calm palette =================== */
:root{
  --bg:#EDF2EF;--r:18px;
  --act:#D27A5B;--step:#2E929D;--sleep:#6D78BF;
  --hero1:#21564A;--hero2:#2B6F5D;--hero3:#38846D;--on-hero:#FFFFFF;
  --arc:#AEEDD0;--arc-w:#F6CB7C;--arc-b:#FFA48F;--act-bar:#FFD39B;
  --sh:0 1px 2px rgba(18,36,28,.05),0 8px 22px -12px rgba(18,36,28,.18);
}
[data-theme="dark"]{
  --bg:#0D1210;--sh:0 1px 2px rgba(0,0,0,.35);
  --act:#E39C80;--step:#63B9C2;--sleep:#9CA5E3;
  --hero1:#10271E;--hero2:#16382C;--hero3:#1D4839;--on-hero:#EAF4EF;
  --arc:#8FDDB9;--arc-w:#E8BE72;--arc-b:#F0937E;--act-bar:#E8BE72;
}
[data-accent="blue"]{--hero1:#143A73;--hero2:#1C52A2;--hero3:#2766BD;--arc:#B8D5FF}
[data-theme="dark"][data-accent="blue"]{--hero1:#0D1D36;--hero2:#132B4E;--hero3:#1A3861;--arc:#9CC3F7}
.bar-title{font-size:22px;letter-spacing:-.6px}
.c-h h2{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.sheet{border-radius:22px 22px 0 0}

/* week strip */
.wkx{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:6px 8px 9px;margin-bottom:12px}
[data-theme="dark"] .wkx{box-shadow:none;border:1px solid var(--line)}
.wkx-h{display:flex;align-items:center;gap:4px;padding-bottom:4px}
.wkx-a{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.wkx-a:active{background:var(--card2)}
.wkx-a:disabled{opacity:.28}
.wkx-t{flex:1;text-align:center;position:relative;line-height:1.2;min-width:0}
.wkx-t b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.wkx-t span{font-size:11.5px;color:var(--ink3)}
.wkx-t input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none}
.wkx-d{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wkx-d button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:15px;color:var(--ink2)}
.wkx-d .w{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.05em}
.wkx-d .n{font-size:15px;font-weight:700;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.wkx-d i{width:5px;height:5px;border-radius:50%;background:transparent}
.wkx-d i.h{background:var(--pri)}
.wkx-d i.f{background:var(--fat)}
.wkx-d button.td .n{color:var(--pri);box-shadow:inset 0 0 0 1.6px color-mix(in srgb,var(--pri) 55%,transparent)}
.wkx-d button.on{background:var(--pri-soft)}
.wkx-d button.on .n{background:var(--pri);color:var(--on-pri);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--pri) 80%,transparent)}
.wkx-d button:disabled{opacity:.3}

/* calorie hero */
.hx{position:relative;border-radius:24px;padding:16px 16px 14px;margin-bottom:12px;color:var(--on-hero);overflow:hidden;
  background:radial-gradient(130% 100% at 100% 0%,rgba(255,255,255,.13),transparent 52%),
    radial-gradient(90% 90% at 0% 100%,rgba(0,0,0,.16),transparent 60%),
    linear-gradient(140deg,var(--hero1),var(--hero2) 55%,var(--hero3));
  box-shadow:0 14px 30px -16px color-mix(in srgb,var(--hero1) 85%,transparent)}
[data-theme="dark"] .hx{box-shadow:none;border:1px solid color-mix(in srgb,var(--hero3) 70%,var(--line))}
.hx:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-80px;top:-100px;border:28px solid rgba(255,255,255,.05);pointer-events:none}
.hx-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;position:relative;z-index:1}
.hx-top .t{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hx-top .s{font-size:11.5px;opacity:.72;margin-top:1px}
.hx-top .sp{flex:1}
.hx-chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.15);white-space:nowrap}
.hx-b{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hx-ring{position:relative;flex:0 0 auto;width:136px;height:136px}
.hx-ring svg{display:block}
.hx-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hx-c b{font-size:31px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.hx-c span{font-size:11.5px;opacity:.78;margin-top:5px;font-weight:600}
.hx-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.hx-r{display:flex;align-items:center;gap:10px;text-align:left;color:inherit;width:100%;min-width:0}
.hx-i{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:0 0 auto}
.hx-m{min-width:0;flex:1;display:block}
.hx-m .k{display:block;font-size:11px;opacity:.74;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-m b{display:block;font-size:18px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.hx-m b small{font-size:11.5px;font-weight:600;opacity:.72;margin-left:3px;letter-spacing:0}
.hx-bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.17);margin-top:5px;overflow:hidden}
.hx-bar i{display:block;height:100%;border-radius:2px;background:var(--act-bar)}
.hx-nx{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:9px 10px;border-radius:15px;background:rgba(255,255,255,.11);color:inherit;text-align:left}
.hx-nx:active{background:rgba(255,255,255,.18)}
.hx-nx .m{flex:1;min-width:0}
.hx-nx .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hx-nx b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-nx .hx-i{width:32px;height:32px;border-radius:11px}

/* macro rings */
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:14px 8px 2px}
.mx>div{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.mx .rg{position:relative;width:88px;height:88px}
.mx .rg svg{display:block}
.mx .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mx .rc b{font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1}
.mx .rc span{font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.mx .nm{font-size:13.5px;font-weight:800;margin-top:7px;display:flex;align-items:center;gap:5px}
.mx .nm i{width:8px;height:8px;border-radius:50%}
.mx .ms{font-size:11.5px;color:var(--ink3);margin-top:1px;white-space:nowrap}
.pfl{display:flex;gap:6px;padding:12px 15px 0}
.pfl span{--pc:var(--pro);flex:1 1 0;min-width:0;text-align:center;padding:7px 4px 6px;border-radius:12px;background:var(--card2);font-size:10.5px;color:var(--ink3);line-height:1.25;border:1px solid transparent;white-space:nowrap}
.pfl span b{display:block;font-size:15px;color:var(--ink);font-weight:800;letter-spacing:-.3px}
.pfl span.on{background:color-mix(in srgb,var(--pc) 12%,var(--card));border-color:color-mix(in srgb,var(--pc) 35%,transparent);color:var(--pc)}
.pfl span.on b{color:var(--pc)}
.pfl span.wa{--pc:var(--warn)}
.pfl span.ok{--pc:var(--ok)}
.esp{padding:12px 15px 15px}
.esp-b{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;background:var(--card3)}
.esp-b i{display:block;height:100%}
.esp-l{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font-size:11.5px;color:var(--ink2);font-weight:600}
.esp-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* activity & body tiles */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{--tc:var(--pri);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 13px 13px;text-align:left;min-width:0;position:relative;display:block;cursor:pointer}
[data-theme="dark"] .tile{box-shadow:none;border:1px solid var(--line)}
.tile:active{transform:scale(.985)}
.tile .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-width:0}
.tile .ib2{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--tc) 14%,var(--card));color:var(--tc)}
.tile .k{font-size:13px;font-weight:700;color:var(--ink2)}
.tile .sp{flex:1}
.tile .v{display:block;font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink3);margin-left:3px;letter-spacing:0}
.tile .d{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pb{display:block;height:6px;border-radius:3px;background:var(--card3);margin-top:10px;overflow:hidden}
.tile .pb i{display:block;height:100%;border-radius:3px;background:var(--tc)}
.tile .tx{font-size:11.5px;font-weight:700;color:var(--tc);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc) 12%,var(--card))}
.tile .dl{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tile.wc{grid-column:1/-1;cursor:default}
.tile.wc:active{transform:none}
.wrow{display:flex;align-items:flex-end;gap:2px}
.wrow .btl{padding:2px 0}
.wrow .pm{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;margin-left:6px}
.wrow .pm button{width:58px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--water) 12%,var(--card));color:var(--water);font-weight:800;font-size:13px}
.wrow .pm button:active{background:color-mix(in srgb,var(--water) 22%,var(--card))}

/* schedule card without the bottles */
.today .tl{padding-bottom:15px}
.today .sum{padding:5px 15px 0}

/* meals as cards (FatSecret) with MyFitnessPal's per-meal totals */
.sec{display:flex;align-items:baseline;gap:8px;padding:6px 4px 9px}
.sec h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.4px}
.sec .sp{flex:1}
.sec .num{font-size:12px;color:var(--ink3);font-weight:600}
.ml-h{display:flex;align-items:center;gap:11px;padding:13px 15px 11px}
.ml-i{--mc:var(--pri);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--mc) 14%,var(--card));color:var(--mc)}
.ml-t{flex:1;min-width:0}
.ml-t b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.ml-t span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-k{text-align:right;flex:0 0 auto}
.ml-k b{display:block;font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.ml-k span{font-size:10.5px;color:var(--ink3)}
.ml-p{height:4px;margin:0 15px 11px;border-radius:2px;background:var(--card3);overflow:hidden}
.ml-p i{display:block;height:100%;border-radius:2px}
.ml-f{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px 12px;border-top:1px solid var(--line)}
.ml-add{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px 0 10px;border-radius:17px;font-size:13px;font-weight:700;color:var(--on-pri);background:var(--pri)}
.ml-add:active{filter:brightness(.93)}
.ml-f .qm{padding:0;display:contents}

/* coach and nutrients */
.cx-i{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;line-height:1;flex:0 0 auto;background:var(--card2)}
.cx-i.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.cx-i.warn{background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.cx-i.info{background:var(--pri-soft)}
.cx-i.ok{background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.nu{padding:11px 15px 12px}
.nu+.nu{border-top:1px solid var(--line)}
.nu-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nu-h .n{font-size:14px;font-weight:700}
.nu-h .sp{flex:1}
.nu-h .v{font-size:16px;font-weight:800;letter-spacing:-.3px}
.nu-h .v small{font-size:11px;color:var(--ink3);font-weight:600;margin-left:2px}
.nu-t{position:relative;height:8px;border-radius:4px;background:var(--card3);overflow:hidden}
.nu-t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* bottom bar with MyFitnessPal's raised add button */
.nav{padding:4px 4px calc(5px + var(--sb))}
.nav .plus{flex:0 0 64px;display:flex;align-items:flex-start;justify-content:center;min-height:48px;padding:0}
.nav .plus span{width:56px;height:56px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;color:var(--on-pri);
  background:var(--pri) linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);
  box-shadow:0 0 0 5px var(--bg),0 10px 22px -8px color-mix(in srgb,var(--pri) 85%,transparent);transition:transform .15s}
.nav .plus:active span{transform:scale(.93)}
.fab{display:none!important}
.ex-h{display:flex;align-items:center;gap:10px;padding:13px 15px 4px}
.ex-h h2{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.addc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.jr-n{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.jr-n>div{line-height:1.05}
.jr-n b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px}
.jr-n b small{font-size:16px;font-weight:700;margin-left:1px}
.jr-n span{display:block;font-size:11px;opacity:.75;font-weight:600;margin-top:3px}
.jr-n svg{opacity:.6}
.jr-n .jr-f{margin-left:auto;text-align:right}
.jr-n .jr-f b{font-size:17px;letter-spacing:-.3px}
.jr-t{position:relative;z-index:1;height:10px;border-radius:5px;background:rgba(255,255,255,.16);margin:14px 0 6px}
.jr-t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--arc)}
.jr-t span{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--arc) 55%,transparent)}
.jr-l{position:relative;z-index:1;display:flex;justify-content:space-between;font-size:11px;opacity:.75;font-weight:600}
.jr-g{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.jr-g>div{background:rgba(255,255,255,.11);border-radius:13px;padding:8px 10px}
.jr-g .k{display:block;font-size:10.5px;opacity:.75;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-g b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.3px;margin-top:1px}

/* =================== stage 7 — Master v3: dark blue + light green, glasses of water, hour-by-hour plan =================== */
:root{--on-water:#FFFFFF}
[data-theme="dark"]{--on-water:#08111F}
[data-accent="navy"]{
  --bg:#EDF1F7;--card:#FFFFFF;--card2:#F4F7FB;--card3:#E7EDF5;
  --line:#DFE6EF;--line2:#CED8E5;
  --ink:#101B2C;--ink2:#4D5C72;--ink3:#8391A5;
  --pri:#1E4A8F;--pri-soft:#E4ECF8;--pri-ink:#173B74;--on-pri:#FFFFFF;
  --pro:#2B9A72;--carb:#C9963F;--fat:#7A70C9;--water:#2D8BD3;
  --ok:#2B9A72;--warn:#CF8735;--bad:#C95A4A;--on-ok:#FFFFFF;
  --act:#D2785A;--step:#2A92A4;--sleep:#6C76C2;
  --hero1:#0F2646;--hero2:#183C6C;--hero3:#22508D;--on-hero:#FFFFFF;
  --arc:#8EE2BF;--arc-w:#F6CB7C;--arc-b:#FFA48F;--act-bar:#FFD39B;
  --sh:0 1px 2px rgba(15,30,55,.05),0 8px 22px -12px rgba(15,30,55,.22);
}
[data-theme="dark"][data-accent="navy"]{
  --bg:#09101C;--card:#101928;--card2:#152033;--card3:#1B283E;
  --line:#22304A;--line2:#2C3B57;
  --ink:#E6ECF6;--ink2:#9BA9BF;--ink3:#6E7C94;
  --pri:#7EA9F0;--pri-soft:#142440;--pri-ink:#A9C6F6;--on-pri:#08111F;
  --pro:#68C99B;--carb:#DDB063;--fat:#A69CE8;--water:#61B1EC;
  --ok:#68C99B;--warn:#DFA35A;--bad:#E27D6B;--on-ok:#08111F;
  --act:#E59D80;--step:#62BCCB;--sleep:#9DA6E6;
  --hero1:#0C1D38;--hero2:#122C53;--hero3:#1A3B6C;--on-hero:#EAF1FB;
  --arc:#8EE2BF;--arc-w:#E8BE72;--arc-b:#F0937E;--act-bar:#E8BE72;
  --sh:0 1px 2px rgba(0,0,0,.35);
}
/* water: your own glass size, one tap per glass */
.wq{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:2px;margin:4px 0 10px}
.wq button{display:grid;place-items:center;padding:3px 0;border-radius:9px}
.wq button:active{background:var(--card2)}
.wq svg{display:block}
.wa-a{display:flex;gap:7px}
.wa-a button{min-height:44px;border-radius:14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.wa-a .big{flex:1 1 auto;background:var(--water);color:var(--on-water);font-size:15.5px;letter-spacing:-.2px}
.wa-a .big:active{filter:brightness(.94)}
.wa-a .sm{flex:0 0 auto;min-width:46px;padding:0 12px;background:color-mix(in srgb,var(--water) 12%,var(--card));color:var(--water)}
.wa-a .sm:active{background:color-mix(in srgb,var(--water) 22%,var(--card))}
.wpace{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.35}
.wpace i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.wpace b{color:var(--ink)}
.wsum{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.wsum b{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--water)}
.wsum span{font-size:12.5px;color:var(--ink2)}
.wlog{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wlog>div{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;font-size:14px}
.wlog>div+div{border-top:1px solid var(--line)}
.wlog .t{font-variant-numeric:tabular-nums;color:var(--ink3);min-width:44px;font-size:13px}
.wlog .v{flex:1;font-weight:700}
.wlog button{width:32px;height:32px;border-radius:10px;color:var(--ink3);background:var(--card2);font-size:19px;line-height:1}
/* today's plan, hour by hour */
.dm{display:flex;gap:5px;padding:11px 15px 0}
.dm button{flex:1 1 0;min-height:34px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--card2);border:1px solid var(--line)}
.dm button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.dm button.on.b{background:var(--warn);border-color:var(--warn);color:#fff}
.dm button.on.f{background:var(--fat);border-color:var(--fat);color:#fff}
.sl{padding:8px 0 0}
.sr{display:grid;grid-template-columns:40px 12px 32px minmax(0,1fr) 18px;align-items:center;column-gap:9px;width:100%;text-align:left;padding:6px 15px;position:relative;color:inherit}
.sr:active{background:var(--card2)}
.sr-t{font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.sr-d{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.sr-d:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.sr:first-child .sr-d:before{top:50%}
.sr:last-child .sr-d:before{bottom:50%}
.sr-d i{position:relative;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--line2)}
.sr-i{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--ink2)}
.sr-m{min-width:0}
.sr-m b{display:block;font-size:14px;font-weight:700;line-height:1.25;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-m span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-c{display:grid;place-items:center;color:var(--ok)}
.sr.w .sr-i{color:var(--water);background:color-mix(in srgb,var(--water) 12%,var(--card))}
.sr.done .sr-d i{background:var(--ok);border-color:var(--ok)}
.sr.done .sr-i{background:color-mix(in srgb,var(--ok) 13%,var(--card));color:var(--ok)}
.sr.done .sr-m b{color:var(--ink2)}
.sr.now{background:var(--pri-soft)}
.sr.now .sr-t{color:var(--pri)}
.sr.now .sr-d i{background:var(--pri);border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent)}
.sr.now .sr-i{background:var(--pri);color:var(--on-pri)}
.sr.miss{opacity:.5}
.sx{display:flex;gap:8px;align-items:center;padding:6px 15px 14px}
.sx .tiny{flex:1;min-width:0}
.sx button{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--pri-ink);padding:7px 12px;border-radius:10px;background:var(--pri-soft)}
.busy-n{margin:10px 15px 0;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--card2));font-size:12px;color:var(--ink2);line-height:1.45}
.busy-n b{color:var(--ink)}
/* guide: day plan + research */
.dpt>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.dpt>div:first-child{border-top:none}
.dpt .tm{font-size:13px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;padding-top:1px}
.dpt b{display:block;font-size:13.5px;line-height:1.3}
.dpt span{display:block;font-size:12px;color:var(--ink2);line-height:1.35}
.refs>div{padding:8px 0;border-top:1px solid var(--line)}
.refs>div:first-child{border-top:none;padding-top:0}
.refs b{display:block;font-size:13.5px;line-height:1.3}
.refs span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:1px}
.refs i{display:block;font-style:normal;font-size:11.5px;color:var(--pri);margin-top:2px;font-weight:700}

/* ===== v4: To Do ===== */
.tdl{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tdl::-webkit-scrollbar{display:none}
.tdl button{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh)}
.tdl button.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tdl button em{font-style:normal;font-size:11.5px;font-weight:800;opacity:.75;font-variant-numeric:tabular-nums}
.tdl button.add{border-style:dashed;box-shadow:none;background:transparent}
.tdh{border-radius:var(--r);padding:16px 16px 15px;margin-bottom:12px;color:var(--on-hero);background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:var(--sh)}
.tdh-t{display:flex;align-items:flex-start;gap:10px}
.tdh h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.tdh .d{font-size:12.5px;opacity:.82;margin-top:3px}
.tdh .n{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tdh .n b{font-size:25px;font-weight:800;letter-spacing:-.6px}
.tdh .n span{display:block;font-size:11px;opacity:.8;margin-top:1px}
.tdh-b{height:7px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:13px;overflow:hidden}
.tdh-b i{display:block;height:100%;border-radius:4px;background:var(--arc);transition:width .35s}
.tdh-x{display:flex;gap:8px;margin-top:11px;font-size:11.5px;opacity:.9;flex-wrap:wrap}
.tdh-x button{color:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.16)}
.tka{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;border:1.5px solid transparent}
.tka:focus-within{border-color:var(--pri)}
.tka>span{color:var(--pri);display:grid;place-items:center}
.tka input{flex:1;min-width:0;border:0;background:transparent;font-size:15.5px;color:var(--ink);padding:10px 0;outline:0}
.tka button{min-height:36px;padding:0 13px;border-radius:10px;background:var(--pri);color:var(--on-pri);font-size:13.5px;font-weight:700}
.tkc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.tkc>.swp+.swp,.tkc>.tk-st+.swp{border-top:1px solid var(--line)}
.tk{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 6px;min-height:58px}
.tk-c{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center}
.tk-c i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;color:transparent;transition:.15s}
.tk.dn .tk-c i{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tk-m{flex:1;min-width:0;text-align:left;padding:7px 4px;color:inherit}
.tk-m b{display:block;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tk.dn .tk-m b{text-decoration:line-through;color:var(--ink3);font-weight:500}
.tk-x{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;font-size:11.5px;color:var(--ink3);margin-top:3px}
.tk-x .tm{font-weight:800;color:var(--pri-ink);font-variant-numeric:tabular-nums}
.tk-x .late{color:var(--bad);font-weight:700}
.tk-x i{font-style:normal;opacity:.6}
.tk-e{width:34px;height:44px;flex:0 0 auto;display:grid;place-items:center;color:var(--ink3);transition:transform .2s}
.tk-e.on{transform:rotate(90deg);color:var(--pri)}
.tk-s{width:42px;height:44px;flex:0 0 auto;display:grid;place-items:center;color:var(--line2)}
.tk-s.on{color:var(--warn)}
.tk-s.on svg{fill:currentColor}
.tk-st{padding:0 10px 9px 50px;background:var(--card)}
.tk-st button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 4px;font-size:14px;color:var(--ink)}
.tk-st button i{width:19px;height:19px;border-radius:50%;border:1.8px solid var(--ink3);flex:0 0 auto;display:grid;place-items:center;color:transparent}
.tk-st button.dn i{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tk-st button.dn span{text-decoration:line-through;color:var(--ink3)}
.tk-h{display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px 10px;font-size:13px;font-weight:800;color:var(--ink2)}
.tk-h svg{transition:transform .2s}
.tk-h.on svg{transform:rotate(90deg)}
.tk-0{padding:30px 20px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.55}
.tk-0 b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tds{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.tds>button:first-child{width:34px;height:38px;display:grid;place-items:center;flex:0 0 auto}
.tds>button:first-child i{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--ink3);display:grid;place-items:center;color:transparent}
.tds.dn>button:first-child i{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tds input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:var(--ink);padding:8px 0;outline:0}
.tds.dn input{text-decoration:line-through;color:var(--ink3)}
.tds>button:last-child{width:34px;height:38px;color:var(--ink3);font-size:19px;flex:0 0 auto}
.tdt{width:100%;border:0;background:transparent;font-size:19px;font-weight:700;color:var(--ink);padding:2px 0 10px;outline:0;letter-spacing:-.3px}
.tdm{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.tdm-h{display:flex;align-items:center;gap:10px;padding:13px 15px 4px}

/* ===== v5: motion (Settings → Display → Animation) ===== */
@keyframes v9spin{to{transform:rotate(360deg)}}
@keyframes v9rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes v9pop{0%{transform:scale(.55)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes v9grow{from{width:var(--from,0%)}}
@keyframes v9draw{from{stroke-dashoffset:var(--c,400)}}
@keyframes v9pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--pri) 0%,transparent)}}
@keyframes v9fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--r))}}
@keyframes v9sheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
body.enter .view.on>*{animation:v9rise .45s cubic-bezier(.2,.75,.25,1) both}
body.enter .view.on>*:nth-child(2){animation-delay:.05s}
body.enter .view.on>*:nth-child(3){animation-delay:.1s}
body.enter .view.on>*:nth-child(4){animation-delay:.15s}
body.enter .view.on>*:nth-child(n+5){animation-delay:.2s}
body.enter .arc-a{animation:v9draw 1s cubic-bezier(.3,.7,.2,1) both}
.tdh{position:relative;overflow:hidden}
body.enter .hx:after,body.enter .tdh:after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.17),transparent);animation:v9sheen 1.1s .25s ease-out both;pointer-events:none}
.bar-a{animation:v9grow .7s cubic-bezier(.2,.75,.25,1) both}
.pop .sr-i,.pop .sr-c,.pop .tk-c i{animation:v9pop .42s cubic-bezier(.3,1.4,.5,1) both}
.sr.now .sr-d i{animation:v9pulse 2.2s ease-in-out infinite}
.b,.chip,.ml-add,.seg button,.tdl button,.gm button,.dm button,.thg button,.fr button{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
.b:active,.chip:active,.ml-add:active,.tdl button:active,.gm button:active,.dm button:active,.thg button:active,.fr button:active{transform:scale(.96)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.cf i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:v9fall 1.6s cubic-bezier(.25,.6,.5,1) forwards}
html[data-motion="off"] *,html[data-motion="off"] *:before,html[data-motion="off"] *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

  radial-gradient(62% 40% at 4% 0%,var(--g1),transparent 70%),radial-gradient(56% 38% at 100% 16%,var(--g2),transparent 70%),
  radial-gradient(64% 42% at 92% 96%,var(--g3),transparent 70%),radial-gradient(54% 38% at 0% 78%,var(--g4),transparent 70%)}
.c,.wkx{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.ib{border-radius:12px;background:color-mix(in srgb,var(--card) 58%,transparent);border:1px solid var(--glass-line)}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -1px 0 var(--glass-line),0 -24px 60px -24px rgba(0,0,0,.45)}

.scrim{background:rgba(8,12,26,.42);-webkit-backdrop-filter:blur(7px) saturate(1.2);backdrop-filter:blur(7px) saturate(1.2)}

  get(k){try{const v=localStorage.getItem(k);return v!==null?v:(k in mem?mem[k]:null);}catch(e){return k in mem?mem[k]:null;}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}}
};
const Store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value);} }catch(e){}
    try{ const s=LS.get(KEY); return s?JSON.parse(s):null; }catch(e){ return null; }
  },
  async set(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s);return;} }catch(e){}
    LS.set(KEY,s);
  }
};

  Object.keys(DB.logs).forEach(d=>{

    if(!L)return delete DB.logs[d];
    const empty = !(L.food||[]).length && !(L.work||[]).length && !L.water && !L.sleep
      && !L.steps && L.weight==null && L.waist==null && !(L.note||'').trim()
      && !L.fast && (L.active==null||L.active==='') && !L.nap && !(L.done&&Object.keys(L.done).length) && !(L.td&&Object.keys(L.td).length) && !L.gym;
    if(empty) delete DB.logs[d];
  });
}

  if(v==null||v==='')return d;

  let s=String(v).trim().replace(/\s/g,'');
  if(s.includes(',')&&s.includes('.'))

const CHARTS=[];

function paintCharts(){

    const spec=CHARTS[+el.dataset.ci]; if(!spec)return;
    const w=Math.max(240,Math.round(el.clientWidth||(el.parentElement&&el.parentElement.clientWidth)||320));

/* drag along the chart to read any day off it */
function bindCross(el,spec){
  const g=spec._g, svg=el.querySelector('svg'), read=el.querySelector('.ch-read');
  if(!g||!svg||!read)return;
  const line=svg.querySelector('.cx-line'), dot=svg.querySelector('.cx-dot');
  const label=i=>spec.dates&&spec.dates[i]?spec.dates[i]:(spec.labels&&spec.labels[i]!=null?String(spec.labels[i]):'#'+(i+1));
  const xAt=i=>g.kind==='bar'?g.padL+i*(g.bw+g.gap)+g.bw/2:g.padL+(g.n===1?g.iW/2:i/(g.n-1)*g.iW);
  const setRead=(i,pinned)=>{
    const v=spec.data[i];
    read.innerHTML=`<b style="color:${v==null?'var(--ink3)':(spec.color||'var(--pri)')}">${v==null?'not logged':fmt(v,spec.dec||0,true)+(spec.unit?' '+spec.unit:'')}</b>
      <span>${esc(label(i))}</span>${pinned?'':'<span class="hint">drag to read any day</span>'}`;
  };
  const show=i=>{
    const px=xAt(i), v=spec.data[i];
    if(line){line.setAttribute('x1',px.toFixed(1));line.setAttribute('x2',px.toFixed(1));line.style.display='';}
    if(dot){
      if(v!=null&&isFinite(v)){
        const py=g.padT+g.iH-(v-g.min)/((g.max-g.min)||1)*g.iH;
        dot.setAttribute('cx',px.toFixed(1));dot.setAttribute('cy',py.toFixed(1));dot.style.display='';
      } else dot.style.display='none';
    }
    setRead(i,true);
  };
  const idxAt=cx=>{
    const r=svg.getBoundingClientRect();

    const i=g.kind==='bar'?Math.round((x-g.padL-g.bw/2)/((g.bw+g.gap)||1))
                          :Math.round((x-g.padL)/(g.iW||1)*(g.n-1));

  svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture&&svg.setPointerCapture(e.pointerId);move(e);});

function niceNum(r,round){

function niceScale(min,max,n){

  for(let v=lo;v<=hi+step*.5;v+=step)t.push(+v.toFixed(6));

function buildBar(W,s){

function buildLine(W,s){

  let xl='';

  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${grid}${band}${path}${dots}${xl}${cross}</svg>`;

function navyBF(m,sex,height){
  if(!m||!m.waist||!m.neck||!height)return null;

  if(sex==='f'){

  if(w-n<=0)return null;
  const v=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(hh))-450;
  return isFinite(v)&&v>0&&v<70?v:null;
}

function portionsFor(field,gap,minPer){

  Object.keys(DB.logs).slice(-60).forEach(d=>(DB.logs[d].food||[]).forEach(f=>{if(f.foodId)seen.add(f.foodId);}));
  const rank=arr=>arr.map(f=>{
      const perUnit=f.basis==='unit', amt=perUnit?1:(f.unitG||100), k=perUnit?1:amt/100;
      const tag=f.name+' '+(f.alias||'');
      return {name:f.name.split(',')[0],v:(f[field]||0)*k,kc:f.kcal*k,avoid:!!avoidOf(tag),
        uses:(f.uses||0)+(f.fav?2:0)+(field==='pro'&&CHEAP_PRO.test(tag)?8:0),lb:perUnit?('1 '+f.unit):(fmt(amt,0)+' g')};
    }).filter(x=>x.v>=(minPer||3)&&!x.avoid)
      .sort((a,b)=>(b.uses-a.uses)||((b.v/Math.max(1,b.kc))-(a.v/Math.max(1,a.kc))));
  const known=rank(DB.foods.filter(f=>(f.uses||0)>0||seen.has(f.id)||f.fav));
  const pool=known.length?known:rank(DB.foods);
  const out=[]; let left=gap;
  for(const p of pool){
    if(out.length>=3||left<=gap*0.15)break;
    if(p.v>=left*0.35){out.push(`${p.lb} ${p.name} (${fmt(p.v,1)} g)`);left-=p.v;}
  }
  if(!out.length&&pool.length)out.push(`${pool[0].lb} ${pool[0].name} (${fmt(pool[0].v,1)} g)`);
  return out.join(' + ');
}

  const C=PFIX.map(([nm,qty,mode,lb])=>{let f=DB.foods.find(x=>x.name===nm);
    if(!f){const x=seedDef(nm);if(x)f={kcal:x.kc,pro:x.p,carb:x.c,fat:x.f,basis:x.b,unitG:x.ug};}
    return f?{lb,p:foodPer(f,qty,mode).pro}:null;}).filter(Boolean);
  const out=[];let left=gap;
  for(const c of C){
    if(left<=4||out.length>=4)break;
    if(c.p>left+12&&C.some(o=>o!==c&&!out.includes(o)&&o.p<=left+12))continue;
    out.push(c);left-=c.p;
  }
  return out.length?out.map(c=>`${c.lb} (${fmt(c.p,0)} g)`).join(' + ')+'.':'';
}

/* ---- Saturday check: two 7-day averages, decided on two weeks, never one ---- */
function weeklyReview(){
  const S=weightSeries(), t0=today();
  const a0=ma(S,7), a1=ma(S.filter(p=>dayDiff(p.d,t0)>=7),7), a2=ma(S.filter(p=>dayDiff(p.d,t0)>=14),7);
  const r1=(a0!=null&&a1!=null)?a1-a0:null, r2=(a1!=null&&a2!=null)?a2-a1:null;
  const early=dayDiff(DB.settings.phaseStart||t0,t0)<14;
  const why='0.7% of body weight a week kept and added lean mass; 1.4% did not (Garthe 2011).';
  const wl=Object.keys(DB.logs).filter(x=>DB.logs[x].waist).sort().pop();
  const wtx=wl?` Waist last measured ${humanY(wl)}: ${fmt(DB.logs[wl].waist,1)} cm.`:' Measure the waist at the navel today.';
  if(r1==null)return {tone:'info',title:'Saturday check',body:'Weigh in every morning — the check compares two 7-day averages.'+wtx,why};
  const head=`Saturday check · ${r1>=0?'down':'up'} ${fmt(Math.abs(r1),2)} kg`;
  if(r1>=0.4&&r1<=1.0)return {tone:'ok',title:head,body:'Inside 0.4–1.0 kg a week. Change nothing.'+wtx,why};
  if(r1<0.4&&r2!=null&&r2<0.4)return {tone:'warn',title:head,body:'Under 0.4 kg two weeks running: add 2,000 steps a day, or take 100 kcal off the goal.'+wtx,why};
  if(r1>1.0&&r2!=null&&r2>1.0&&!early)return {tone:'warn',title:head,body:'Over 1 kg two weeks running: add 150 kcal of carbohydrate.'+wtx,why};
  return {tone:'info',title:head,body:(early&&r1>1?'Weeks 1–2 drop fast — water and glycogen. ':'One week is noise. ')+'Decide on next Saturday’s number.'+wtx,why};
}

function arcSVG(S,sw,pct,col,track,marks){
  const r=(S-sw)/2-1, c=2*Math.PI*r, p=clamp(pct||0,0,100), off=c-p/100*c;
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" aria-hidden="true">
    <circle cx="${S/2}" cy="${S/2}" r="${r.toFixed(2)}" fill="none" stroke="${track}" stroke-width="${sw}"/>
    ${p>0?`<circle cx="${S/2}" cy="${S/2}" r="${r.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${S/2} ${S/2})" class="arc-a" style="--c:${c.toFixed(2)}"/>`:''}
    ${(marks||[]).map(m=>{const a=(clamp(m,0,100)/100*360-90)*Math.PI/180, r1=r-sw/2-1.5, r2=r+sw/2+1.5;
      return `<line x1="${(S/2+r1*Math.cos(a)).toFixed(1)}" y1="${(S/2+r1*Math.sin(a)).toFixed(1)}" x2="${(S/2+r2*Math.cos(a)).toFixed(1)}" y2="${(S/2+r2*Math.sin(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>`;}).join('')}
  </svg>`;
}

function proPills(p,z,t){

function numIn(id,val,sfx,step){

function bump(id,d){
  const e=document.getElementById(id); if(!e)return;
  const a=Math.abs(d), dec=String(a).includes('.')?(String(a).split('.')[1]||'').length:0;
  e.value=fmt(Math.max(0,pn(e.value)+d),dec);

}

function unitOf(f){return (f&&f.msr==='ml')?'ml':'g';}
function foodPer(f,qty,mode){
  const grams = mode==='unit' ? qty*(f.unitG||100) : qty;
  const k = f.basis==='unit' ? (mode==='unit'?qty:qty/(f.unitG||100)) : grams/100;
  return {kcal:f.kcal*k,pro:f.pro*k,carb:f.carb*k,fat:f.fat*k,fib:(f.fib||0)*k,
    sod:(f.sod||0)*k,sug:(f.sug||0)*k,sugF:(f.sugF||0)*k,grams};
}
function fMatch(f,q){if(!q)return true;q=q.toLowerCase();

function aiParse(x){

function scPaste(){

  else toast('Paste the reply into the box instead');
}
function scRead(){
  const S=window._sc, r=aiParse(S.raw||'');
  if(!r){S.err='That text holds no readable result. In the scanner tap Copy for Recomp, then paste here.';drawScan();return;}
  S.items=r.items;S.tip=r.tip;S.err='';drawScan();
}
async function scGo(){
  const S=window._sc; if(S.busy)return;
  const note=S.note.trim(), mode=aiMode();
  if(mode==='link')return;
  if(!S.blob&&!note){S.err='Take a photo or type what you ate.';drawScan();return;}
  S.busy=true;S.err='';S.t0=Date.now();S.ac=('AbortController' in window)?new AbortController():null;drawScan();
  const tick=setInterval(()=>{const e=document.getElementById('sc_w');if(e)e.textContent=`Reading… ${Math.round((Date.now()-S.t0)/1000)} s`;},500);
  try{
    const pr=aiPrompt(note,!!S.blob); let res;
    if(mode==='claude'){
      if(S.blob&&!AI.img)throw {code:'no_img'};
      const o={modelTier:aiCfg().fast?'quick':'default',effort:'low',cache:false}; if(S.ac)o.signal=S.ac.signal; if(S.blob)o.images=[S.blob];
      res=await AI.sample.json(pr,o);
    }else res=await aiClaude(pr,S.blob,S.ac?S.ac.signal:undefined);
    const r=aiParse(res); if(!r)throw {code:'parse'};
    S.items=r.items;S.tip=r.tip;
  }catch(e){
    const c=String((e&&(e.code||e.name))||''), m=e&&e.message?String(e.message).slice(0,140):'';
    S.err=c==='cancelled'||c==='AbortError'?'':c==='not_granted'?'Claude is not allowed on this page. Use the scanner page instead.'
      :c==='rate_limited'||c==='http_429'?'Too many requests just now. Wait a minute and try again.'
      :c==='no_img'||c==='images_unavailable'?'Photos cannot be sent from this view. Type what you ate, or use the scanner page.'
      :c==='image_rejected'?'That photo could not be read. Try another one.'
      :c==='parse'||c==='invalid_json'?'The reply could not be read. Try again, or add a short note.'
      :c==='http_401'||c==='http_403'?'Claude refused the API key. Check it in Settings → Meal scan.'
      :c==='http_404'?'Claude does not know that model name. Check it in Settings → Meal scan.'
      :/^http_4/.test(c)?'Claude refused the request. '+m
      :/^http_5/.test(c)?'Claude is busy right now. Try again in a moment.'
      :'Could not reach Claude'+(m?': '+m:'')+'. The scanner page still works.';
  }
  clearInterval(tick);S.busy=false;
  if(window._sc===S&&$('#sheet').classList.contains('on'))drawScan();
}
function scAdd(){
  const S=window._sc, L=getLog(DAY), meal=$('#sc_m').value; let kc=0;
  S.items.forEach(i=>{const k=i.g/(i.g0||1);
    L.food.push({id:uid(),foodId:null,name:i.name||'Food',qty:Math.round(i.g),mode:'g',unitLb:'g',meal,kcal:i.kcal*k,pro:i.p*k,carb:i.c*k,fat:i.f*k,fib:i.fb*k,sod:i.na*k,sug:i.sg*k,sugF:0,ai:1});
    kc+=i.kcal*k;});
  const n=S.items.length; if(S.url)try{URL.revokeObjectURL(S.url);}catch(e){}
  save();closeSheet();if(VIEW!=='diary')VIEW='diary';render();toast(`${n} item${n>1?'s':''} added — ${fmt(kc,0,true)} kcal`);
}

function shOFF(){
  sheet('Search online',`<p class="sub" style="margin-top:0">Looks up Open Food Facts, an open product database. Anything you pick is copied into your own database, so it keeps working offline.</p>
    <div class="brow"><input class="in" id="off_q" placeholder="Product or brand" style="flex:1"><button class="b pri" style="flex:0 0 84px" onclick="offGo()">Find</button></div>

}
async function offGo(){
  const q=$('#off_q').value.trim(); if(!q)return;
  $('#off_r').innerHTML='<div class="tiny">Searching…</div>';
  try{
    const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=product_name,brands,nutriments,serving_quantity`);
    const j=await r.json();
    const ps=(j.products||[]).filter(p=>p.product_name&&p.nutriments&&p.nutriments['energy-kcal_100g']!=null);
    if(!ps.length){$('#off_r').innerHTML='<div class="empty"><b>No results</b>Try a shorter term, or add it by hand.</div>';return;}
    window._off=ps;
    $('#off_r').innerHTML=`<div class="c" style="margin:0">${ps.map((p,i)=>`<div class="it" onclick="offAdd(${i})">
      <div class="m"><div class="t1">${esc(p.product_name)}</div><div class="t2">${esc(p.brands||'—')} · ${fmt(p.nutriments['energy-kcal_100g'],0)} kcal / 100 g</div></div>
      <div class="r" style="color:var(--pri)">+</div></div>`).join('')}</div>`;
  }catch(e){$('#off_r').innerHTML='<div class="empty"><b>Could not reach the service</b>Check your connection, or add the food by hand.</div>';}
}
function offAdd(i){
  const p=window._off[i], n=p.nutriments;
  DB.foods.push({id:uid(),name:p.product_name+(p.brands?' ('+p.brands.split(',')[0]+')':''),alias:'',cat:'Custom',
    basis:'g',unit:'serving',msr:'g',unitG:pn(p.serving_quantity,100)||100,kcal:n['energy-kcal_100g']||0,
    pro:n.proteins_100g||0,carb:n.carbohydrates_100g||0,fat:n.fat_100g||0,fib:n.fiber_100g||0,
    sod:(n.sodium_100g||0)*1000,sug:n.sugars_100g||0,sugF:n.sugars_100g||0,fav:0,uses:0});
  save();closeSheet();go('food');toast('Saved to your database');
}

function shAddWork(){ shLift(); }
/* ---------- Hevy-style lifting logger ----------------------------------
   Quick mode is the default: a title, a duration and a calorie figure is a
   complete session. Detailed mode adds the set table, and nothing in it is
   compulsory — you can log three exercises or none. */
function newDraft(){
  return {day:DAY,name:sugSession()||'Workout',started:Date.now(),min:0,kcal:0,note:'',mode:'quick',ex:[]};
}
function shLift(){
  if(!DB.draft||DB.draft.day!==DAY)DB.draft=newDraft();
  drawLift();
}
function draftLiftMin(){
  const d=DB.draft;
  if(d.min>0)return d.min;
  return d.started?Math.max(0,Math.round((Date.now()-d.started)/60000)):0;
}
function draftCardio(){
  const kg=curWeight();
  return (DB.draft.ex||[]).filter(e=>e.kind==='cardio')
    .map(e=>({min:pn(e.min),kcal:pn(e.kcal)>0?pn(e.kcal):metKcal(e.met||6,pn(e.min),kg)}));
}
function draftMin(){return draftLiftMin()+sum(draftCardio(),c=>c.min);}
function draftKcal(){
  const d=DB.draft, kg=curWeight();
  const lift=d.kcal>0?d.kcal:metKcal(6.0,draftLiftMin(),kg);
  return lift+sum(draftCardio(),c=>c.kcal);
}
function drawLift(){
  const d=DB.draft, min=draftMin();
  const lifts=d.ex.filter(e=>e.kind!=='cardio');
  const sets=sum(lifts,e=>e.sets.length), vol=sum(lifts,e=>exVolume(e,curWeight()));
  sheet('Log workout',`
    <input class="in" id="lf_nm" value="${esc(d.name)}" placeholder="Evening workout"
      style="font-size:18px;font-weight:700;border:none;background:transparent;padding:0 0 4px" oninput="DB.draft.name=this.value">
    <div class="wsum">
      <div><b id="lfDur">${hhmm(min)}</b><span>Duration</span></div>
      <div><b id="lfVol">${fmt(vol,0,true)}</b><span>Volume kg</span></div>
      <div><b id="lfSets">${sets}</b><span>Sets</span></div>
      <div><b id="lfKcal">${fmt(draftKcal(),0,true)}</b><span>kcal</span></div>
    </div>
    <div class="seg" style="margin-bottom:14px">
      <button class="${d.mode==='quick'?'on':''}" onclick="liftMode('quick')">Quick</button>
      <button class="${d.mode==='full'?'on':''}" onclick="liftMode('full')">Log every set</button>
    </div>
    <div class="g2">
      <div class="f"><label>Lifting time</label>${numIn('lf_min',draftLiftMin(),'min',5)}</div>
      <div class="f"><label>Calories — Garmin wins</label>${numIn('lf_kcal',Math.round(draftKcal()),'kcal',10)}</div>
    </div>
    <div class="chips" style="margin:-4px 0 14px">
      ${[30,45,60,75,90].map(n=>`<button class="chip" onclick="setDur(${n})">${n} min</button>`).join('')}
      ${d.started?`<button class="chip" onclick="setDur(-1)">Since start</button>`:''}
    </div>
    <div id="lfBody">${d.mode==='full'?liftBody():''}</div>
    <div class="f" style="margin-top:4px"><label>Note</label>
      <input class="in" id="lf_note" value="${esc(d.note||'')}" placeholder="Felt heavy · shoulder fine" oninput="DB.draft.note=this.value"></div>
    <div class="brow" style="margin-bottom:8px">
      <button class="b pri" onclick="saveLift()">Save workout</button>
      <button class="b dan" style="flex:0 0 96px" onclick="discardLift()">Discard</button>
    </div>
    <div class="tiny">${d.mode==='quick'
      ? 'Quick is enough. The calorie box pre-fills from 6 METs at your current weight; type the Garmin figure over it whenever you have one, because a chest or wrist strap reading beats a table lookup.'
      : 'Nothing here is compulsory. Add only the movements you want a record of; the rest of the session still counts through duration.'}</div>
    <div id="restSlot"></div>`);
  const mi=$('#lf_min'), ki=$('#lf_kcal');
  if(mi)mi.addEventListener('input',()=>{DB.draft.min=pn(mi.value);if(!DB.draft.kcal&&ki)ki.value=fmt(draftKcal(),0);updLift();});
  if(ki)ki.addEventListener('input',()=>{DB.draft.kcal=pn(ki.value);updLift();});
  if(restEnd>Date.now()&&!restT)restT=setInterval(paintRest,250);
  (d.ex||[]).forEach((e,ei)=>{ if(e.kind!=='cardio')return;
    ['cb_m','cb_d','cb_h','cb_k'].forEach(p=>{const el=$('#'+p+ei); if(el)el.addEventListener('input',updLift);});});
  paintRest();
}
function liftMode(m){DB.draft.mode=m;save();drawLift();}
function setDur(n){
  DB.draft.min = n<0 ? Math.max(1,Math.round((Date.now()-(DB.draft.started||Date.now()))/60000)) : n;
  DB.draft.kcal=0;save();drawLift();
}
function updLift(){
  readCardioInputs();
  const d=DB.draft, lifts=d.ex.filter(e=>e.kind!=='cardio');
  const sets=sum(lifts,e=>e.sets.length), vol=sum(lifts,e=>exVolume(e,curWeight()));
  const g=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  g('#lfDur',hhmm(draftMin()));g('#lfVol',fmt(vol,0,true));g('#lfSets',sets);g('#lfKcal',fmt(draftKcal(),0,true));
}
const SSC=['#8155D6','#2795C9','#DB9B2A','#2E9E68'];
function liftBody(){
  const d=DB.draft;
  const add=`<div class="brow" style="margin-bottom:12px">
      <button class="b" onclick="shPickEx()">+ Movement</button>
      <button class="b" onclick="shPickCardio()">+ Treadmill / cardio</button></div>`;
  if(!d.ex.length)return `<div class="empty" style="border:1px dashed var(--line);border-radius:12px;margin-bottom:12px">
      <b>Nothing added yet</b>Add movements to record sets, or a treadmill block to close the session out. Staying in Quick and saving the duration is also a complete log.
      </div>`+add;
  return d.ex.map((e,ei)=>e.kind==='cardio'?cardioBlockHTML(e,ei):liftBlockHTML(e,ei)).join('')+add;
}
function cardioBlockHTML(e,ei){

      <button class="mn" onclick="DEL_ACTIONS.exdraft(${ei})">&times;</button></div>
