<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8">
<title>Recomp — Diary</title>
<style>
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --card2:#F6F8FB; --card3:#EDF1F6;
  --line:#E3E8EF; --line2:#D6DEE8;
  --ink:#141A22; --ink2:#5A6675; --ink3:#8C97A6;
  --pri:#1668E3; --pri-soft:#E9F1FE; --pri-ink:#0F4FAD;
  --pro:#2E9E68; --carb:#DB9B2A; --fat:#8155D6; --water:#2795C9;
  --ok:#2E9E68; --warn:#D98A3C; --bad:#D8544A;
  --sh:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);
  --sh2:0 4px 16px rgba(16,24,40,.10);
  --r:14px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1116; --card:#171C23; --card2:#1E242D; --card3:#252C36;
  --line:#2A323C; --line2:#333C48;
  --ink:#E9ECF1; --ink2:#9AA5B4; --ink3:#727E8D;
  --pri:#4B93F0; --pri-soft:#16273F; --pri-ink:#7FB2F5;
  --pro:#42B67E; --carb:#E0AA46; --fat:#9A73E4; --water:#3FA9D8;
  --ok:#42B67E; --warn:#E0A055; --bad:#E36A60;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 4px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);overscroll-behavior-y:none}
body{
  font-family:var(--sys);font-size:16px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(66px + var(--sb));
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
a{color:var(--pri);text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:calc(var(--st) + 8px) 14px 10px}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-title{font-size:19px;font-weight:700;letter-spacing:-.4px}
.bar-sub{font-size:11.5px;color:var(--ink3);margin-top:-1px}
.bar-top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--card2)}
.ib:active{background:var(--card3)}
.srch{position:relative}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
#q{width:100%;height:40px;padding:0 36px 0 34px;background:var(--card2);border:1px solid var(--line);border-radius:11px;font-size:15px}
#q::placeholder{color:var(--ink3)}
#qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;color:var(--ink3);display:none;place-items:center;font-size:19px}
#qx.on{display:grid}

main{max-width:620px;margin:0 auto;padding:12px 12px 16px}
.view{display:none}.view.on{display:block}

/* ---------- cards ---------- */
.c{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.c-p{padding:15px}
.c-h{display:flex;align-items:center;gap:8px;padding:13px 15px 0}
.c-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px}
.c-h .sp{flex:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--ink3);line-height:1.45}
.hr{height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

/* ---------- date nav ---------- */
.dnav{display:flex;align-items:center;background:var(--card);border-radius:12px;box-shadow:var(--sh);margin-bottom:12px;padding:4px}
.dnav button{width:46px;height:44px;border-radius:9px;color:var(--pri);font-size:21px;display:grid;place-items:center}
.dnav button:disabled{color:var(--ink3);opacity:.35}
.dnav .mid{flex:1;text-align:center;position:relative}
.dnav .d1{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.dnav .d2{font-size:11.5px;color:var(--ink3)}
.dnav input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none}

/* ---------- calorie hero (MFP-style) ---------- */
.hero{padding:16px 15px 14px}
.hero-top{display:flex;align-items:center;gap:16px}
.hero-r{flex:0 0 auto}
.hero-i{flex:1;min-width:0}
.hero-big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.hero-lb{font-size:12.5px;color:var(--ink2);margin-top:3px}
.eq{display:flex;align-items:flex-start;margin-top:14px;gap:2px}
.eq-i{flex:1 1 0;min-width:0;text-align:center}
.eq-o{flex:0 0 13px;text-align:center;font-size:14px;color:var(--ink3);padding-top:2px}
.eq-v{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.eq-l{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- macro strip ---------- */
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:13px 15px 15px;border-top:1px solid var(--line)}
.mac-i{min-width:0}
.mac-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px;margin-bottom:5px}
.mac-n{font-size:11.5px;font-weight:600;color:var(--ink2)}
.mac-v{font-size:11px;color:var(--ink3);white-space:nowrap}
.trk{height:6px;border-radius:4px;background:var(--card3);overflow:hidden}
.trk i{display:block;height:100%;border-radius:4px;transition:width .45s cubic-bezier(.34,1.2,.64,1)}

/* ---------- range bar (no absolute labels = no overlap) ---------- */
.rb{padding:13px 15px}
.rb+.rb{border-top:1px solid var(--line)}
.rb-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.rb-n{font-size:14px;font-weight:600}
.rb-h .sp{flex:1}
.rb-v{font-size:16px;font-weight:700;letter-spacing:-.3px}
.rb-u{font-size:11.5px;color:var(--ink3);font-weight:500;margin-left:2px}
.rb-t{position:relative;height:9px;border-radius:5px;background:var(--card3);overflow:hidden}
.rb-band{position:absolute;top:0;bottom:0;background:rgba(46,158,104,.16)}
.rb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .45s cubic-bezier(.34,1.2,.64,1)}
.rb-tick{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--card);opacity:.9}
.rb-legend{display:flex;margin-top:8px;gap:4px}
.rb-legend div{flex:1 1 0;min-width:0;text-align:center}
.rb-legend b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.2px}
.rb-legend span{display:block;font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-note{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.45}

/* ---------- meal rows ---------- */
.meal-h{display:flex;align-items:center;gap:8px;padding:12px 15px 8px}
.meal-h .n{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.meal-h .sp{flex:1}
.meal-h .k{font-size:13px;color:var(--ink3);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--line)}
.it:active{background:var(--card2)}
.it .m{flex:1;min-width:0}
.it .t1{font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t2{font-size:11.5px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .r{font-size:14.5px;font-weight:600;text-align:right;flex:0 0 auto}
.it .r small{display:block;font-size:10px;color:var(--ink3);font-weight:400}
.addrow{display:flex;align-items:center;gap:7px;padding:11px 15px;border-top:1px solid var(--line);color:var(--pri);font-size:13.5px;font-weight:600;width:100%}
.addrow:active{background:var(--pri-soft)}
.alpha{padding:6px 15px;background:var(--card2);font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.08em;border-top:1px solid var(--line)}

/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink)}
.b:active{background:var(--card3)}
.b.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.b.pri:active{filter:brightness(.92)}
.b.dan{color:var(--bad);border-color:rgba(216,84,74,.32)}
.b.full{width:100%}
.b.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.brow{display:flex;gap:8px}.brow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:36px;padding:0 13px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center}
.chip:active{background:var(--card3)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.w{color:var(--water);border-color:rgba(39,149,201,.3)}
.seg{display:flex;background:var(--card3);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

/* ---------- fields ---------- */
.f{margin-bottom:13px}
.f>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.in,select.in,textarea.in{width:100%;min-height:46px;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:11px;font-size:16px}
.in:focus{border-color:var(--pri);outline:none;background:var(--card)}
textarea.in{min-height:76px;resize:vertical}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.stp{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card2)}
.stp button{width:46px;flex:0 0 auto;background:var(--card3);color:var(--ink2);font-size:21px;font-weight:400}
.stp button:active{background:var(--pri);color:#fff}
.stp .in{border:none;border-radius:0;text-align:center;background:transparent;min-height:46px}
.stp .sfx{display:flex;align-items:center;padding:0 11px;color:var(--ink3);font-size:12.5px;background:var(--card3)}

/* ---------- stat tiles ---------- */
.st{background:var(--card2);border-radius:11px;padding:11px}
.st .k{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.st .d{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.ch-h{display:flex;align-items:baseline;gap:8px;padding:13px 15px 4px}
.ch-h .t{font-size:14px;font-weight:700}
.ch-h .sp{flex:1}
.ch-h .a{font-size:11.5px;color:var(--ink3)}
.ch-b{padding:2px 8px 10px}
.ch-lg{display:flex;gap:12px;padding:0 15px 12px;flex-wrap:wrap}
.ch-lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.ch-lg span{font-size:11px;color:var(--ink3)}

/* ---------- flags / notes ---------- */
.flag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.flag.ok{background:rgba(46,158,104,.12);color:var(--ok)}
.flag.wa{background:rgba(217,138,60,.13);color:var(--warn)}
.flag.ba{background:rgba(216,84,74,.12);color:var(--bad)}
.flag.in{background:var(--pri-soft);color:var(--pri-ink)}
.note{background:var(--card2);border-radius:10px;padding:11px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.note.wa{background:rgba(217,138,60,.09)}
.note b{color:var(--ink)}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty b{display:block;color:var(--ink2);font-size:14.5px;font-weight:700;margin-bottom:5px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);display:flex;padding:5px 2px calc(4px + var(--sb));max-width:620px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 2px;color:var(--ink3);min-height:48px}
.nav button.on{color:var(--pri)}
.nav .l{font-size:10px;font-weight:600;letter-spacing:-.1px}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--sb));z-index:55;width:54px;height:54px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:var(--sh2)}
.fab:active{filter:brightness(.92)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,34,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 15px calc(20px + var(--sb));transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;background:var(--line2);border-radius:3px;margin:8px auto 0}
.sh-h{position:sticky;top:0;background:var(--card);padding:11px 0 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px;z-index:3}
.sh-h h3{margin:0;font-size:17px;font-weight:700}
.sh-h .sp{flex:1}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,12px);z-index:120;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{position:relative;width:50px;height:30px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--card3);border-radius:16px;transition:.24s}
.sw i:before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.24s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i:before{transform:translateX(20px)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
table.tb th:first-child{text-align:left}
table.tb td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.tb td:first-child{text-align:left;font-variant-numeric:normal}
.badge{background:var(--card2);border-radius:11px;padding:11px 6px;text-align:center}
.badge .e{font-size:23px;line-height:1.2}
.badge .n{font-size:9.5px;color:var(--ink3);margin-top:3px;line-height:1.25}
.paper{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:9px;border-left:3px solid var(--pri)}
.paper .a{font-size:14px;font-weight:700}
.paper .i{font-size:11.5px;color:var(--pri-ink);margin:2px 0 6px}
.paper .f{font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ---------- lifting logger ---------- */
.wsum{display:flex;gap:4px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.wsum div{flex:1;min-width:0;text-align:center}
.wsum b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.wsum span{display:block;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.exb{border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;background:var(--card)}
.exb-h{display:flex;align-items:center;gap:9px;padding:11px 12px 8px}
.exb-h .nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--pri);line-height:1.25}
.exb-h .mn{width:32px;height:32px;border-radius:8px;color:var(--ink3);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.exb-meta{display:flex;align-items:center;gap:8px;padding:0 12px 9px;flex-wrap:wrap}
.ss-tag{background:#8155D6;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;letter-spacing:.02em}
.rest-btn{font-size:12px;color:var(--pri);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.sgrid{display:grid;grid-template-columns:30px minmax(56px,1fr) 60px 56px 38px;align-items:center;gap:6px;padding:0 12px}
.sgrid.hd{padding-top:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sgrid.hd span{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrid.hd span:nth-child(2){text-align:left}
.srow{min-height:46px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:none}
.srow.done{background:rgba(46,158,104,.13)}
[data-theme="dark"] .srow.done{background:rgba(46,158,104,.16)}
.srow .n{font-size:14px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.srow .pv{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow input{width:100%;min-height:36px;padding:0 4px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-radius:8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.srow.done input{background:transparent;border-color:transparent}
.srow input:focus{border-color:var(--pri);background:var(--card);outline:none}
.tick{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;
  color:transparent;background:var(--card2);margin:0 auto}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.exb-add{width:100%;padding:11px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--card2);border-top:1px solid var(--line)}
.exb-add:active{background:var(--card3)}
.rest-bar{position:sticky;bottom:0;z-index:5;background:var(--pri);color:#fff;border-radius:12px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;margin-top:10px;box-shadow:var(--sh2)}
.rest-bar b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.rest-bar span{flex:1;font-size:12.5px;opacity:.9}
.rest-bar button{color:#fff;font-size:12.5px;font-weight:700;padding:7px 11px;border:1px solid rgba(255,255,255,.45);border-radius:8px}
.draft{display:flex;align-items:center;gap:11px;background:var(--pri-soft);border:1px solid var(--pri);
  border-radius:12px;padding:12px 14px;margin-bottom:12px}
.draft .d1{font-size:14px;font-weight:700;color:var(--pri-ink)}

/* ---------- storage (works as artifact, as a hosted file, or offline) --- */
const KEY='recomp.v2';
const mem={};
const LS={
  get(k){try{const v=localStorage.getItem(k);return v!==null?v:(k in mem?mem[k]:null);}catch(e){return k in mem?mem[k]:null;}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}}
};
const Store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value);} }catch(e){}
    try{ const s=LS.get(KEY); return s?JSON.parse(s):null; }catch(e){ return null; }
  },
  async set(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s);return;} }catch(e){}
    LS.set(KEY,s);
  }
};
let saveT=null;
/* viewing a date creates a blank record; drop those so the day count and the
   backup file only ever contain days that actually hold something */
function pruneLogs(){
  Object.keys(DB.logs).forEach(d=>{
    const L=DB.logs[d];
    if(!L)return delete DB.logs[d];
    const empty = !(L.food||[]).length && !(L.work||[]).length && !L.water && !L.sleep
      && !L.steps && L.weight==null && L.waist==null && !(L.note||'').trim();
    if(empty) delete DB.logs[d];
  });
}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{pruneLogs();DB.meta.saved=Date.now();Store.set(DB);},200);}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const avg=a=>a.length?sum(a)/a.length:null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* a JS string literal that is safe inside an HTML attribute — an apostrophe in a
   food name would otherwise close the handler and break the button */
function jsq(s){return esc(JSON.stringify(String(s==null?'':s)));}
/* accepts 1,5 · 1.5 · 1.234,5 · 1,234.5 · "81,1 kg" */
function pn(v,d=0){
  if(v==null||v==='')return d;
  if(typeof v==='number')return isFinite(v)?v:d;
  let s=String(v).trim().replace(/\s/g,'');
  if(s.includes(',')&&s.includes('.'))
    s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else s=s.replace(',','.');
  s=s.replace(/[^0-9.\-]/g,'');
  const n=parseFloat(s);return isFinite(n)?n:d;
}
function fmt(n,dec=0,grp){
  if(n==null||!isFinite(n))return '—';
  let s=Math.abs(Number(n)).toFixed(dec), neg=Number(n)<0;
  let [i,f]=s.split('.');
  if(grp)i=i.replace(/\B(?=(\d{3})+(?!\d))/g, DB.settings.dec===','?'.':',');
  s=i+(f?(DB.settings.dec===','?',':'.')+f:'');
  return (neg?'−':'')+s;
}
const iso=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>iso(new Date());
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function human(s){const d=new Date(s+'T12:00:00');return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];}
function humanY(s){const d=new Date(s+'T12:00:00');return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function hhmm(m){if(m==null||!isFinite(m))return '—';return Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

  o.bmr = s&&s.lbm ? 370+21.6*s.lbm : (s&&s.rmr ? s.rmr : 1550);

const CHARTS=[];

function niceNum(r,round){
  if(r<=0)return 1;
  const e=Math.floor(Math.log10(r)), f=r/Math.pow(10,e);
  const nf = round ? (f<1.5?1:f<3?2:f<7?5:10) : (f<=1?1:f<=2?2:f<=5?5:10);
  return nf*Math.pow(10,e);
}
function niceScale(min,max,n){
  n=n||4; if(!(max>min))max=min+1;
  const step=niceNum(niceNum(max-min,false)/(n-1),true);
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+step*.5;v+=step)t.push(+v.toFixed(6));
  return {min:lo,max:hi,step,ticks:t};
}
/* keep only labels that do not touch their neighbour */
function thinLabels(items,fontPx,gap){
  const out=[],cw=fontPx*.58; let lastR=-1e9;
  items.forEach(it=>{
    const w=String(it.text).length*cw, l=it.x-w/2, r=it.x+w/2;
    if(l>lastR+(gap||6)){out.push(it);lastR=r;}
  });
  return out;
}
const AX='#8C97A6';
function axisText(x,y,t,anchor,size,fill){

function buildBar(W,s){
  const data=s.data||[], labels=s.labels||[], n=data.length;
  const H=s.h||158, padL=s.noAxis?6:38, padR=10, padT=12, padB=labels.length?22:8;
  const iW=W-padL-padR, iH=H-padT-padB;
  if(!n||iW<40)return `<svg class="chart" width="${W}" height="${H}"></svg>`;
  const vals=data.filter(v=>v!=null&&isFinite(v));
  const top=Math.max(s.target?s.target*1.12:0, vals.length?Math.max(...vals):0, 1);
  const sc=niceScale(0,top,4);

  const gap=n>26?1:n>13?2:4;
  const bw=Math.max(1.5,(iW-gap*(n-1))/n);

  if(!s.noAxis) sc.ticks.forEach(t=>{
    grid+=`<line x1="${padL}" y1="${y(t).toFixed(1)}" x2="${W-padR}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`
        + axisText(padL-6,y(t)+3.5,fmt(t,0,true),'end',9.5);

    if(v==null||!isFinite(v))return;

function buildLine(W,s){
  const data=s.data||[], labels=s.labels||[], n=data.length;
  const H=s.h||150, padL=s.noAxis?6:40, padR=12, padT=12, padB=labels.length?22:8;
  const iW=W-padL-padR, iH=H-padT-padB;
  const vals=data.filter(v=>v!=null&&isFinite(v));
  if(vals.length<2||iW<40)
    return `<svg class="chart" width="${W}" height="${H}">${axisText(W/2,H/2,'Not enough data yet','middle',12,'var(--ink3)')}</svg>`;
  let lo=Math.min(...vals), hi=Math.max(...vals);

  const pad=(hi-lo)*.12||Math.max(.5,hi*.02);
  const sc=niceScale(lo-pad,hi+pad,4);

    grid+=`<line x1="${padL}" y1="${y(t).toFixed(1)}" x2="${W-padR}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`

  if(cur.length>1)segs.push(cur);

  let path=segs.map(sg=>'<path d="'+sg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+`" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  let dots='';

  if(shown.length<=22) shown.forEach(o=>{dots+=`<circle cx="${x(o.i).toFixed(1)}" cy="${y(o.v).toFixed(1)}" r="2.8" fill="${col}"/>`;});
  else{const l=shown[shown.length-1];dots=`<circle cx="${x(l.i).toFixed(1)}" cy="${y(l.v).toFixed(1)}" r="3.4" fill="${col}"/>`;}
  let xl='';
  if(labels.length){
    const items=labels.map((t,i)=>({x:x(i),text:t})).filter((_,i)=>data[i]!=null);
    thinLabels(items,9.5,8).forEach(it=>{xl+=axisText(it.x,H-6,it.text,'middle',9.5);});
  }
  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${grid}${band}${path}${dots}${xl}</svg>`;
}

function portionsFor(field,gap,minPer){
  const pool=DB.foods.map(f=>{
    const perUnit = f.basis==='unit';
    const amt = perUnit?1:(f.unitG||100);
    const k = perUnit?1:amt/100;
    return {name:f.name.split(',')[0],v:(f[field]||0)*k,kc:f.kcal*k,
      lb:perUnit?('1 '+f.unit):(fmt(amt,0)+' g')};
  }).filter(x=>x.v>=(minPer||3)).sort((a,b)=>(b.v/Math.max(1,b.kc))-(a.v/Math.max(1,a.kc)));
  const out=[]; let left=gap;
  for(const p of pool){
    if(out.length>=3||left<=0)break;
    if(p.v>=left*0.35){out.push(`${p.lb} ${p.name} (${fmt(p.v,1)} g)`);left-=p.v;}
  }
  if(!out.length&&pool.length)out.push(`${pool[0].lb} ${pool[0].name} (${fmt(pool[0].v,1)} g)`);
  return out.join(' + ');
}
function coachTips(d){
  const t=targets(),L=getLog(d),z=dayTotals(d),T=t.T;
  const W=windowStats(7),M=windowStats(28),S=weightSeries();
  const isT=d===today(), hour=new Date().getHours();
  const tips=[];
  const add=(pri,tone,icon,title,body,why)=>tips.push({pri,tone,icon,title,body,why});

  /* ---- the day in front of you ---- */
  if(t.protein){
    const gap=t.protein.sweet-z.pro;
    if(gap>=10) add(gap>=40?1:2,'warn','🥩',`Protein short by ${fmt(gap,0)} g`,
      portionsFor('pro',gap,4)||'Add a protein source at the next meal.',
      `Target ${fmt(t.protein.sweet,0)} g = 2.5 g per kg of lean mass. Floor is ${fmt(t.protein.floor,0)} g even on rest days (Helms 2014).`);
    else if(z.pro>0&&z.pro<t.protein.floor)
      add(1,'bad','🥩',`Below the protein floor by ${fmt(t.protein.floor-z.pro,0)} g`,
        portionsFor('pro',t.protein.floor-z.pro,4),
        `${fmt(t.protein.floor,0)} g is the line that protects muscle in a deficit. It does not move on rest days.`);
  }
  const fibGap=25-z.fib;
  if(z.kcal>0&&fibGap>=6) add(5,'warn','🥗',`Fibre short by ${fmt(fibGap,0)} g`,
    portionsFor('fib',fibGap,1.5)||'Add vegetables or fruit.',
    '25–38 g a day (Dietary Guidelines 2025–2030). Fibre is the cheapest fullness you can buy in a deficit.');
  if(t.sugFMax&&z.sugF>t.sugFMax) add(3,'bad','🍬',`Free sugar over by ${fmt(z.sugF-t.sugFMax,0)} g`,
    `${fmt(z.sugF,0)} g logged against a ceiling of ${fmt(t.sugFMax,0)} g. Sweet tea, condensed milk and kecap manis are usually where it hides.`,
    'Free and added sugars under 10% of calories, ideally under 5% (WHO 2015). Sugar inside whole fruit and plain milk does not count.');
  if(z.sod>t.sodMax) add(4,'warn','🧂',`Sodium over by ${fmt(z.sod-t.sodMax,0)} mg`,
    'Instant noodles, bottled sambal, kecap and broth carry most of it. Do not cut salt to nothing though — you train in a tropical climate and sweat heavily.',
    'Under 2,300 mg a day (Dietary Guidelines 2025–2030).');
  const wGap=t.water[0]-(L.water||0);
  if(wGap>=300) add(6,'warn','💧',`Water short by ${fmt(wGap,0,true)} ml`,
    `About ${Math.ceil(wGap/250)} more glasses of 250 ml. Add 500–750 ml on top for every training hour.`,
    `30–40 ml per kg of body weight. A 2% loss of body weight in fluid already cuts strength performance (ACSM 2007).`);
  if(t.fatMin&&z.kcal>0&&z.fat<t.fatMin) add(7,'warn','🥑',`Fat below the minimum by ${fmt(t.fatMin-z.fat,0)} g`,
    'Eggs, peanut butter, olive oil or avocado will cover it without much bulk.',
    'At least 0.5 g per kg of body weight. Below that, absorption of vitamins A, D, E and K suffers and steroid hormone production drops.');
  if(t.kcal){
    const over=z.kcal-t.kcal;
    if(over>200) add(3,'bad','⚖️',`Calories over by ${fmt(over,0,true)}`,
      'One day does not undo a week. Do not compensate by skipping the next meal and losing the protein with it — just return to the plan tomorrow.',
      'Adherence of 85–90% produces nearly the whole result of 100%, with far fewer people quitting.');
    else if(z.kcal>0&&over<-350&&(!isT||hour>=20)) add(4,'warn','⚖️',`Calories ${fmt(-over,0,true)} under target`,
      `Eating well under ${fmt(t.kcal,0,true)} is not faster progress. It is the same fat loss with more muscle lost.`,
      'Slow loss gained 2.1% lean mass; fast loss gained none, with similar fat lost (Garthe 2011).');
  }
  if(isT&&z.burn<=0&&hour>=15) add(8,'info','🏃','Nothing logged for training yet',
    `A 30–40 minute Zone 2 walk or ride sits at ${Math.round((DB.profile.hrmax||189)*.6)}–${Math.round((DB.profile.hrmax||189)*.7)} bpm and recovers fast enough to repeat tomorrow.`,
    'Zone 2 builds mitochondrial capacity without collecting the fatigue that costs you lifting sessions (San-Millán & Brooks 2018).');
  if(L.sleep&&L.sleep.min<420) add(2,'bad','😴',`Slept ${hhmm(L.sleep.min)} — under seven hours`,
    'Move lights out earlier tonight rather than trying to sleep in. Set the bedtime, not the alarm.',
    'Same deficit at 5.5 h versus 8.5 h: the share of weight lost that came from fat fell 55%, the rest came off lean tissue (Nedeltcheva 2010).');
  if(isT&&hour>=19&&(L.steps||0)<8000&&(L.steps||0)>0) add(9,'info','👟',`${fmt(8000-(L.steps||0),0,true)} steps short of the floor`,
    'A 15-minute walk covers most of it.',
    'Non-exercise movement is the lever that quietly disappears once a deficit starts.');

  /* ---- the week behind you ---- */
  if(T.suspect) add(1,'bad','🔍','The log and the scale disagree',
    `Your recorded intake implies a maintenance of ${fmt(T.measured,0,true)} kcal, at or below resting expenditure. That is almost always food going unrecorded rather than a slow metabolism. Weigh cooking oil, sauce, broth, sugar in coffee and anything eaten standing in the kitchen for one week.`,
    'People with obesity under-reported intake by 30–50%, usually without knowing it (Lichtman 1992).');
  const m7=ma(S,7), m7p=ma(S.filter(p=>dayDiff(p.d,today())>=7),7);
  const rate=(m7!=null&&m7p!=null)?(m7p-m7):null;
  if(rate!=null&&t.rate){
    if(rate>t.rate[1]*1.3) add(2,'warn','📉',`Losing ${fmt(rate,2)} kg a week — faster than the band`,
      `Target is ${fmt(t.rate[0],2)}–${fmt(t.rate[1],2)} kg. If next week looks the same, add 150–200 kcal.`,
      'Losing faster does not remove more fat. It removes the chance to add muscle (Garthe 2011).');
    else if(rate<0.05&&W.logged>=5) add(3,'info','📊','The scale has not moved this week',
      'Check logging accuracy and step count before touching calories. One week flat is noise; three weeks flat with the waist also unchanged is a plateau.',
      'A gram of glycogen holds about three grams of water, so a real fat loss can hide behind fluid for weeks.');
  }
  const wv=weeklySets(7);
  if(wv.sessions>0){
    const thin=MGROUPS.filter(g=>(wv.sets[g]||0)<6);
    if(thin.length&&thin.length<=3) add(4,'warn','🏋️',`${thin.join(', ')} under-trained this week`,
      `${thin.map(g=>g+' '+fmt(wv.sets[g]||0,0)+' sets').join(' · ')}. The working range is 10–16 direct sets per muscle per week.`,
      'Weekly volume per muscle is the strongest single driver of growth, with the returns flattening past roughly 16 sets (Schoenfeld 2017, Pelland 2025).');
  }
  if(W.lifts<3) add(3,'warn','🏋️',`Only ${W.lifts} lifting ${W.lifts===1?'session':'sessions'} in seven days`,
    'When time is short, cut cardio and keep the gym. Lifting is what decides whether the weight comes off fat or off muscle.',
    'Two sessions per muscle per week beat one when volume matched (Schoenfeld 2016).');
  if(t.protein){
    const miss=W.rows.filter(r=>r.L&&(r.L.food||[]).length&&r.t.pro<t.protein.floor).length;
    if(miss>=3) add(2,'warn','🥩',`Under the protein floor on ${miss} of the last 7 days`,
      'Splitting it across four meals of about 35 g is easier than chasing it at dinner.',
      'Four doses of 20 g every three hours beat two of 40 g for muscle protein synthesis (Areta 2013).');
  }
  if(W.sleep&&W.sleep<400) add(2,'bad','😴',`Averaging ${hhmm(W.sleep)} of sleep this week`,
    'This is the single largest uncontrolled variable in your program right now, and it is free to fix.',
    'Short sleep also raises ghrelin and lowers leptin, so the afternoon hunger is physiology, not willpower (Spiegel 2004).');
  const lastW=S.length?S[S.length-1].d:null;
  if(!lastW||dayDiff(lastW,today())>=3) add(5,'info','⚖️',`No weigh-in for ${lastW?dayDiff(lastW,today()):'several'} days`,
    'Morning, after the toilet, before food or drink. Read the seven-day average, never the single number.',
    'Regular weighing tracks with better outcomes, provided the reading is treated as a data point rather than a verdict (Zheng 2015).');
  const waistDays=Object.keys(DB.logs).filter(x=>DB.logs[x].waist).sort();
  const lastWaist=waistDays.length?waistDays[waistDays.length-1]:null;
  if(!lastWaist||dayDiff(lastWaist,today())>=14) add(6,'info','📏','Waist not measured in two weeks',
    'At the navel, morning, before food, tape not pulled tight. This is what keeps you honest when the scale stalls on water.',
    'Waist tracks fat loss more faithfully than scale weight during a recomposition.');
  const sc=lastScan();
  if(sc&&dayDiff(sc.date,today())>=35) add(6,'info','🧭',`Last scan was ${dayDiff(sc.date,today())} days ago`,
    'A fresh Karada reading recalculates lean mass, and with it the protein bands and the calorie goal.',
    'Bioimpedance carries ±3–5% error, so what matters is the direction across 4–8 weeks.');
  if(M.logged>=20&&DB.settings.phase.startsWith('cut')){
    const weeks=Math.floor(M.logged/7);
    if(weeks>=4) add(7,'info','🔄','Diet break due after eight weeks of deficit',
      'Two weeks at maintenance, with protein unchanged. Schedule it rather than waiting until you need it.',
      'In MATADOR that pattern produced 12.3 kg of fat lost against 8.0 kg on continuous dieting across the same deficit time (Byrne 2018).');
  }
  if(!tips.length) add(9,'ok','✅','Everything on target today',
    'Protein, water, calories and sleep are all inside their bands. This is what the boring weeks look like, and the boring weeks are the ones that work.','');
  return tips.sort((a,b)=>a.pri-b.pri);
}

function saveDay(){

function numIn(id,val,sfx,step){
  const dec=String(step).includes('.')?(String(step).split('.')[1]||'').length:0;
  return `<div class="stp">
    <button type="button" onclick="bump('${id}',-${step})" aria-label="Decrease">−</button>
    <input class="in num" id="${id}" type="text" inputmode="decimal" value="${val==null||val===''?'':fmt(val,dec)}" placeholder="0">
    ${sfx?`<span class="sfx">${esc(sfx)}</span>`:''}
    <button type="button" onclick="bump('${id}',${step})" aria-label="Increase">+</button></div>`;
}
function bump(id,d){
  const e=document.getElementById(id); if(!e)return;
  const a=Math.abs(d), dec=String(a).includes('.')?(String(a).split('.')[1]||'').length:0;
  e.value=fmt(Math.max(0,pn(e.value)+d),dec);
  e.dispatchEvent(new Event('input'));
}

const CATS=['All','Protein','Starch','Fruit','Vegetable','Fat','Extra','Custom'];
function foodPer(f,qty,mode){
  const grams = mode==='unit' ? qty*(f.unitG||100) : qty;
  const k = f.basis==='unit' ? (mode==='unit'?qty:qty/(f.unitG||100)) : grams/100;
  return {kcal:f.kcal*k,pro:f.pro*k,carb:f.carb*k,fat:f.fat*k,fib:(f.fib||0)*k,
    sod:(f.sod||0)*k,sug:(f.sug||0)*k,sugF:(f.sugF||0)*k,grams};
}
function fMatch(f,q){if(!q)return true;q=q.toLowerCase();
  return (f.name+' '+(f.alias||'')+' '+(f.cat||'')+' '+(f.unit||'')).toLowerCase().includes(q);}

  const rec=DB.recents.map(i=>DB.foods.find(f=>f.id===i)).filter(Boolean).slice(0,8);

    <div class="chips">${fav.map(f=>`<button class="chip" onclick="shAddFood('Meal 1','${f.id}')">★ ${esc(f.name.split(',')[0])}</button>`).join('')}</div></div>`:''}
  ${list.length?`<div class="c">${Object.keys(grp).sort().map(L=>`<div class="alpha">${L}</div>
    ${grp[L].map(f=>`<div class="it" onclick="shFood('${f.id}')">
      <div class="m"><div class="t1">${f.fav?'★ ':''}${esc(f.name)}</div>
        <div class="t2">${esc(f.cat)} · per ${f.basis==='unit'?'1 '+esc(f.unit):'100 g'} · 1 ${esc(f.unit)} ≈ ${fmt(f.unitG,0)} g${f.alias?' · '+esc(f.alias):''}</div></div>
      <div class="r num">${fmt(f.kcal,0,true)}<small>${fmt(f.pro,1)} g protein</small></div></div>`).join('')}`).join('')}</div>`
    :`<div class="c"><div class="empty"><b>No matches</b>Nothing here matches “${esc(foodQ)}”.

  <div class="tiny" style="text-align:center;padding:4px 0 8px">Tap a row to edit or delete · ${list.length} of ${DB.foods.length} shown</div>`;
}

let restT=null,restEnd=0;

function paintRest(){
  const slot=$('#restSlot'); if(!slot)return;

    if(restEnd>0){restEnd=0;clearInterval(restT);restT=null;beep();beep();}
    slot.innerHTML='';return;
  }
  slot.innerHTML=`<div class="rest-bar"><b>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b>

  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.18);
    o.start();o.stop(c.currentTime+.2);}catch(e){}
}

/* ---- training volume, the audit from Section 09 done automatically ---- */
const MGROUPS=['Chest','Back','Shoulders','Arms','Legs','Core'];
function exGroup(name){
  const e=DB.ex.find(x=>x.name===name);
  return e&&MGROUPS.includes(e.pattern)?e.pattern:'Other';
}
function weeklySets(days){
  days=days||7;
  const out={};MGROUPS.forEach(g=>out[g]=0);out.Other=0;
  let sessions=0,tonnage=0;
  for(let i=0;i<days;i++){
    const d=addDays(today(),-i), L=DB.logs[d];
    if(!L)continue;
    (L.work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      if(sessionCount(w))sessions++;
      sessionEx(w).forEach(e=>{
        const g=exGroup(e.name);
        out[g]=(out[g]||0)+e.sets.length;
        e.sets.forEach(s=>{tonnage+=(s.kg||0)*(s.rep||0);});
      });
    });
  }
  return {sets:out,sessions,tonnage};
}
/* the top set of each movement, session by session — is the load actually going up */
function movementHistory(){
  const by={};
  Object.keys(DB.logs).sort().forEach(d=>{
    (DB.logs[d].work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      sessionEx(w).forEach(e=>{
        if(!e.sets.length)return;
        const top=e.sets.reduce((a,s)=>((s.kg||0)*(s.rep||0)>(a.kg||0)*(a.rep||0)?s:a),e.sets[0]);
        (by[e.name]=by[e.name]||[]).push({d,kg:top.kg||0,rep:top.rep||0,vol:sum(e.sets,x=>(x.kg||0)*(x.rep||0))});
      });
    });
  });
  return by;
}

function windowStats(n){
  const days=[];let d=today();for(let i=0;i<n;i++){days.push(d);d=addDays(d,-1);}
  const rows=days.map(x=>({d:x,L:DB.logs[x],t:dayTotals(x)})).reverse();
  const ate=rows.filter(r=>r.L&&r.L.food&&r.L.food.length);
  const pick=(f,g)=>avg(rows.filter(f).map(g));
  return {n,rows,logged:ate.length,
    kcal:avg(ate.map(r=>r.t.kcal)),pro:avg(ate.map(r=>r.t.pro)),carb:avg(ate.map(r=>r.t.carb)),
    fat:avg(ate.map(r=>r.t.fat)),fib:avg(ate.map(r=>r.t.fib)),sod:avg(ate.map(r=>r.t.sod)),
    sug:avg(ate.map(r=>r.t.sug)),sugF:avg(ate.map(r=>r.t.sugF)),

/* ---- Progress → Training ---- */
function pgTrain(){
  const W=weeklySets(7), M=weeklySets(28), hist=movementHistory();
  const bar=(g)=>{
    const n=W.sets[g]||0, lo=10, hi=16, max=22;
    const tone = n===0?'var(--ink3)' : n<6?'var(--bad)' : n<lo?'var(--warn)' : n<=hi?'var(--ok)':'var(--warn)';
    const st = n===0?'nothing' : n<6?'far short' : n<lo?'light' : n<=hi?'in range':'high';
    return `<div style="margin-bottom:13px">
      <div class="row" style="margin-bottom:5px"><span class="mac-n">${g}</span><span class="sp" style="flex:1"></span>
        <span class="num" style="font-size:12px;color:${tone}">${fmt(n,0)} sets · ${st}</span></div>
      <div class="rb-t"><div class="rb-band" style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></div>
        <div class="rb-fill" style="width:${clamp(n/max*100,0,100)}%;background:${tone}"></div></div></div>`;
  };
  const names=Object.keys(hist).sort((a,b)=>hist[b].length-hist[a].length);
  const wkTon=[];for(let i=7;i>=0;i--){const s=addDays(today(),-i*7);let t=0;
    for(let j=0;j<7;j++){const d=addDays(s,j);if(d>today())continue;
      (DB.logs[d]?DB.logs[d].work||[]:[]).forEach(w=>{if(w.type==='lift')t+=sessionVol(w);});}
    wkTon.push(t);}
  return `
  <div class="c c-p">
    <div class="row" style="margin-bottom:12px"><div class="lbl">Direct sets per muscle · last 7 days</div></div>
    ${MGROUPS.map(bar).join('')}
    <div class="note">The green band is 10–16 sets a week, the range where added volume still buys growth before the returns flatten (Schoenfeld 2017, Pelland 2025). Only direct sets are counted — a bench press counts for chest, not for triceps — so the real figure for arms sits a little higher than what is drawn here.</div>
  </div>

  <div class="c c-p">
    <div class="g3">
      <div class="st"><div class="k">Sessions</div><div class="v num" style="color:${W.sessions>=3?'var(--ok)':'var(--warn)'}">${W.sessions}</div><div class="d">last 7 days · target 3–4</div></div>
      <div class="st"><div class="k">Tonnage</div><div class="v num">${fmt(W.tonnage,0,true)}</div><div class="d">kg lifted this week</div></div>
      <div class="st"><div class="k">Per month</div><div class="v num">${M.sessions}</div><div class="d">sessions in 28 days</div></div>
    </div>
  </div>

  <div class="c">
    <div class="ch-h"><span class="t">Weekly tonnage</span><span class="sp"></span><span class="a">kg lifted per week</span></div>
    <div class="ch-b">${chartHost({kind:'bar',data:wkTon,labels:wkTon.map((_,i)=>i===7?'now':'-'+(7-i)+'w'),color:'var(--pri)',h:150})}</div>
    <div class="c-p" style="padding-top:0"><div class="tiny">Tonnage is sets × reps × load. It should drift upward across a block; a fall while calories are low usually means recovery, not the program.</div></div>
  </div>

  <div class="c">
    <div class="c-h"><h2>Is the load going up</h2><span class="sp"></span><span class="tiny">${names.length} movements</span></div>
    ${names.length?names.slice(0,14).map(n=>{
      const h=hist[n], last=h[h.length-1], prev=h.length>1?h[h.length-2]:null;
      const dv=prev?last.vol-prev.vol:null;
      return `<div class="it"><div class="m"><div class="t1">${esc(n)}</div>
        <div class="t2 num">${humanY(last.d)} · top set ${fmt(last.kg,last.kg%1?1:0)} kg × ${fmt(last.rep,0)}${prev?' · was '+fmt(prev.kg,prev.kg%1?1:0)+' × '+fmt(prev.rep,0):''}</div></div>
        <div class="r num" style="color:${dv==null?'var(--ink3)':dv>0?'var(--ok)':dv<0?'var(--warn)':'var(--ink3)'}">${dv==null?'—':(dv>0?'+':'')+fmt(dv,0,true)}<small>kg volume</small></div></div>`;
    }).join('')
    :'<div class="empty"><b>No sets recorded yet</b>Log a session with the set table and this fills in on its own.</div>'}
    ${names.length?'<div class="c-p"><div class="note">One thing goes up every week: load, reps, or sets. If a lift falls twice in a row while sleep and calories are on target, that is under-recovery rather than a bad program.</div></div>':''}
  </div>`;
}

function streak(test){
  let n=0;
  for(let i=0;i<400;i++){const d=addDays(today(),-i);if(test(d))n++;else if(i===0)continue;else break;}
  return n;
}
function pgStreak(){
  const t=targets(), M=windowStats(30);
  const sLog=streak(d=>{const L=DB.logs[d];return L&&(L.food||[]).length>0;});
  const sPro=streak(d=>t.protein&&dayTotals(d).pro>=t.protein.floor);
  const sTrain=streak(d=>dayTotals(d).burn>0);
  const sSleep=streak(d=>{const L=DB.logs[d];return L&&L.sleep&&L.sleep.min>=420;});
  const bar=(l,n,d,good)=>{const p=d?n/d*100:0;const c=p>=good?'var(--ok)':p>=good*.7?'var(--pri)':'var(--warn)';
    return `<div style="margin-bottom:13px"><div class="row" style="margin-bottom:5px"><span class="mac-n">${l}</span>
      <span class="sp" style="flex:1"></span><span class="num" style="font-size:12px;color:${c}">${n}/${d} · ${fmt(p,0)}%</span></div>
      <div class="trk"><i style="width:${p}%;background:${c}"></i></div></div>`;};
  const S=weightSeries(), first=S.length?S[0]:null, cur=curWeight();
  let totalKm=0,sessions=0;
  Object.keys(DB.logs).forEach(d=>(DB.logs[d].work||[]).forEach(w=>{totalKm+=w.dist||0;sessions++;}));
  const lost=first?first.w-cur:0;
  const badges=[
    ['🎯','First 5 kg down',lost>=5],['⚡','10 kg down',lost>=10],['🏁','Under 72 kg',cur<72],
    ['📓','7 days logged',sLog>=7],['📗','30 days logged',sLog>=30],
    ['🥩','7 days at protein floor',sPro>=7],['🏆','30 days at protein floor',sPro>=30],
    ['😴','7 nights at 7 h',sSleep>=7],['🏋️','50 sessions',sessions>=50],
    ['🚴','100 km logged',totalKm>=100],['🚀','1,000 km logged',totalKm>=1000],['📅','90 days logged',sLog>=90]
  ];
  const got=badges.filter(b=>b[2]).length;
  return `
  <div class="c c-p">
    <div class="lbl" style="margin-bottom:11px">Current streaks</div>
    <div class="g2" style="grid-template-columns:repeat(4,1fr);gap:8px">
      ${[['Logged',sLog],['Protein',sPro],['Trained',sTrain],['Slept 7 h',sSleep]].map(([l,n])=>
        `<div class="st" style="text-align:center"><div class="v num" style="color:${n>0?'var(--pri)':'var(--ink3)'}">${n}</div><div class="k" style="margin:3px 0 0">${l}</div></div>`).join('')}
    </div>
    <div class="tiny" style="margin-top:11px">Consecutive days, counting back from today.</div>
  </div>

  <div class="c c-p">
    <div class="lbl" style="margin-bottom:13px">Last 30 days</div>
    ${bar('Logged intake',M.rows.filter(r=>r.L&&r.L.food&&r.L.food.length).length,30,80)}
    ${bar('Protein at or above floor',M.rows.filter(r=>t.protein&&r.t.pro>=t.protein.floor).length,30,80)}
    ${bar('Protein at target',M.rows.filter(r=>t.protein&&r.t.pro>=t.protein.sweet).length,30,70)}
    ${bar('Water target met',M.rows.filter(r=>r.L&&r.L.water>=t.water[0]).length,30,75)}
    ${bar('Sleep 7 h or more',M.rows.filter(r=>r.L&&r.L.sleep&&r.L.sleep.min>=420).length,30,75)}
    ${bar('8,000 steps or more',M.rows.filter(r=>r.L&&r.L.steps>=8000).length,30,75)}
    <div class="note">85–90% adherence delivers nearly all the result of 100%, with far fewer people quitting. Process targets beat outcome targets because you control them directly.</div>
  </div>

  <div class="c c-p">
    <div class="row" style="margin-bottom:12px"><div class="lbl">Milestones</div><span class="sp" style="flex:1"></span><span class="tiny">${got} of ${badges.length}</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      ${badges.map(b=>`<div class="badge" style="opacity:${b[2]?1:.4}">
        <div class="e">${b[2]?b[0]:'🔒'}</div><div class="n">${b[1]}</div></div>`).join('')}
    </div>
  </div>`;
}

/* ---- minimal ZIP writer (stored, no compression) so "export everything" is a
   single download; browsers, and iOS Safari in particular, block a burst of them ---- */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipFiles(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  files.forEach(f=>{
    const data=enc.encode(f.data), nm=enc.encode(f.name), crc=crc32(data);
    const lh=new Uint8Array(30+nm.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,0,true);lv.setUint16(12,0,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);
    lv.setUint16(26,nm.length,true);lv.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,nm.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(nm,46);cen.push(ch);
    off+=lh.length+data.length;
  });
  const cenSize=cen.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  return new Blob([...parts,...cen,end],{type:'application/zip'});
}

    const od=o.days[d]||{}, src=od.foods||od.food||[], acts=od.activities||od.activity||[];
    out.logs[d]={
      food:src.map(f=>{const nm=f.nm||f.n||'Food', kc=pn(f.cal!==undefined?f.cal:f.c);
        return {id:uid(),foodId:null,name:nm,qty:1,mode:'unit',unitLb:'serving',meal:'Meal 1',
          kcal:kc,pro:pn(f.p),carb:pn(f.cal!==undefined?f.c:f.cb),fat:pn(f.f),fib:pn(f.fib),sod:pn(f.na)};}),
      work:acts.map(a=>({id:uid(),type:'cardio',name:a.nm||a.n||'Session',min:pn(a.mins),
        dist:pn(a.km),hr:0,kcal:pn(a.cal!==undefined?a.cal:a.c)})),
      water:pn(od.water),sleep:null,steps:pn(od.steps)||(acts.reduce((s,a)=>s+pn(a.steps!==undefined?a.steps:a.s),0)||null),
      weight:od.weight!=null?pn(od.weight):null,waist:od.waist!=null?pn(od.waist):null,note:''};
  });
  (o.expenses||[]).forEach(e=>out.expenses.push({id:e.id||uid(),n:e.n||e.nm||'Expense',
    amt:pn(e.amt!==undefined?e.amt:e.amount),d:e.d||e.date||today(),
    cat:({Makanan:'Food',Suplemen:'Supplements',Gym:'Gym',Peralatan:'Gear',Lainnya:'Other'})[e.cat]||e.cat||'Other'}));
  return out;
}
function doImport(mode){
  const o=window._imp; if(!o)return;
  const isV2=!!o.logs&&!!o.foods&&!!o.meta;
  if(isV2&&mode==='replace'){DB=Object.assign(freshDB(),o);}
  else{
    const c = isV2 ? {foods:o.foods,logs:o.logs,scans:o.scans||[],expenses:o.expenses||[],reminders:o.reminders} : convertLegacy(o);
    if(mode==='replace'){DB=freshDB();DB.foods=[];DB.logs={};}
    const names=new Set(DB.foods.map(f=>f.name.toLowerCase()));
    (c.foods||[]).forEach(f=>{if(!names.has(String(f.name).toLowerCase())){DB.foods.push({...f,id:uid()});names.add(String(f.name).toLowerCase());}});
    Object.keys(c.logs||{}).forEach(d=>{if(!DB.logs[d]||mode==='replace')DB.logs[d]=c.logs[d];});
    const sk=new Set(DB.scans.map(s=>s.date+s.time));
    (c.scans||[]).forEach(s=>{if(!sk.has(s.date+s.time))DB.scans.push({...s,id:uid()});});
    const ek=new Set(DB.expenses.map(e=>e.id));
    (c.expenses||[]).forEach(e=>{if(!ek.has(e.id))DB.expenses.push(e);});
    if(c.reminders&&c.reminders.length&&mode==='replace')DB.reminders=c.reminders;
  }
  pruneLogs();save();closeSheet();render();toast('Import finished');
}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function expCSV(kind){
  const rows=buildRows(kind);
  dl(`recomp-${kind}-${today()}.csv`,rows.map(r=>r.map(csvEsc).join(',')).join('\n'),'text/csv');
  toast('CSV downloaded');
}
function buildRows(kind){
  let rows=[];
  if(kind==='foods'){
    rows.push(['name','alias','category','basis','unit','unit_grams','calories','protein','carbs','fat','fiber','sodium','total_sugar','free_sugar']);
    DB.foods.forEach(f=>rows.push([f.name,f.alias,f.cat,f.basis,f.unit,f.unitG,f.kcal,f.pro,f.carb,f.fat,f.fib,f.sod,f.sug||0,f.sugF||0]));
  }else if(kind==='scans'){
    rows.push(['date','time','device','weight_kg','body_fat_pct','lean_mass_kg','fat_mass_kg','visceral','muscle_pct','body_age','resting_kcal','bmi','waist_cm','note']);
    [...DB.scans].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const d=scanDerived(s);
      rows.push([s.date,s.time,s.src,s.weight,s.bf,d.lbm?d.lbm.toFixed(2):'',d.fatMass?d.fatMass.toFixed(2):'',s.vf,s.musc,s.bodyAge,s.rmr,s.bmi,s.waist,s.note]);});
  }else if(kind==='workouts'){
    rows.push(['date','type','name','minutes','distance_km','avg_hr','sets','volume_kg','calories']);
    Object.keys(DB.logs).sort().forEach(d=>(DB.logs[d].work||[]).forEach(w=>
      rows.push([d,w.type,w.name,w.min||'',w.dist||'',w.hr||'',sessionCount(w),sessionVol(w)?sessionVol(w).toFixed(0):'',Math.round(w.kcal||0)])));
  }else if(kind==='sets'){
    rows.push(['date','session','exercise','set_number','weight_kg','reps','rir','volume_kg']);
    Object.keys(DB.logs).sort().forEach(d=>(DB.logs[d].work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      sessionEx(w).forEach(e=>e.sets.forEach((s,i)=>
        rows.push([d,w.name,e.name,i+1,s.kg,s.rep,s.rir,(s.kg*s.rep).toFixed(0)])));}));
  }else if(kind==='expenses'){
    rows.push(['date','item','category','amount_idr']);
    [...DB.expenses].sort((a,b)=>String(a.d).localeCompare(String(b.d))).forEach(e=>rows.push([e.d,e.n,e.cat,e.amt]));
  }else if(kind==='exercises'){
    rows.push(['name','type','group','met','source','times_used']);
    DB.ex.forEach(e=>rows.push([e.name,e.type,e.pattern,e.met,e.src||'',e.uses||0]));
  }else{
    rows.push(['date','calories','protein_g','carbs_g','fat_g','fiber_g','sodium_mg','total_sugar_g','free_sugar_g','water_ml','sleep_min','sleep_quality','steps','training_kcal','training_min','weight_kg','waist_cm','note']);
    Object.keys(DB.logs).sort().forEach(d=>{const L=DB.logs[d],z=dayTotals(d);
      rows.push([d,z.kcal.toFixed(0),z.pro.toFixed(1),z.carb.toFixed(1),z.fat.toFixed(1),z.fib.toFixed(1),z.sod.toFixed(0),
        z.sug.toFixed(1),z.sugF.toFixed(1),L.water||0,L.sleep?L.sleep.min:'',L.sleep?L.sleep.q:'',L.steps||'',
        z.burn.toFixed(0),z.min,L.weight||'',L.waist||'',L.note||'']);});
  }
  return rows;
}
function impCSV(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{
    const lines=r.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast('That file looks empty');return;}
    const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){o.push(c);c='';}else c+=ch;}o.push(c);return o;};
    const H=sp(lines[0]).map(h=>h.trim().toLowerCase());
    const ix=(...ks)=>{for(const k of ks){const i=H.findIndex(h=>h===k||h.includes(k));if(i>=0)return i;}return -1;};
    const I={n:ix('name','food','description'),k:ix('calories','energy','kcal'),p:ix('protein'),
      c:ix('carbohydrate','carbs','carb'),f:ix('fat'),fb:ix('fiber','fibre'),s:ix('sodium'),
      u:ix('unit'),ug:ix('unit_grams','grams','serving'),sg:ix('total_sugar','sugars','sugar'),sf:ix('free_sugar','added_sugar')};
    if(I.n<0||I.k<0){toast('Needs at least a name and a calories column');return;}
    let n=0;
    lines.slice(1).forEach(l=>{
      const c=sp(l), nm=(c[I.n]||'').trim(); if(!nm)return;
      DB.foods.push({id:uid(),name:nm,alias:'',cat:'Custom',basis:'g',
        unit:(I.u>=0&&c[I.u])?c[I.u].trim():'serving',unitG:I.ug>=0?pn(c[I.ug],100):100,
        kcal:pn(c[I.k]),pro:I.p>=0?pn(c[I.p]):0,carb:I.c>=0?pn(c[I.c]):0,fat:I.f>=0?pn(c[I.f]):0,
        fib:I.fb>=0?pn(c[I.fb]):0,sod:I.s>=0?pn(c[I.s]):0,
        sug:I.sg>=0?pn(c[I.sg]):0,sugF:I.sf>=0?pn(c[I.sf]):(I.sg>=0?pn(c[I.sg]):0),fav:0,uses:0});
      n++;
    });
    save();render();toast(n+' foods imported');
  };
  r.readAsText(f); inp.value='';
}
function wipe(){
  sheet('Erase all data',`<p class="sub" style="margin-top:0">This deletes every logged day, every scan, and your food database on this device. Export a backup first if you want any of it.</p>
    <button class="b full" style="margin-bottom:9px" onclick="expJSON()">Export a backup first</button>
    <button class="b dan full" onclick="DB=freshDB();save();closeSheet();DAY=today();go('diary');toast('Everything erased')">Erase now</button>`);
}

/* ------------------------------ SEARCH -------------------------------- */
function vSearch(el){
  const q=SQ.trim().toLowerCase();
  if(!q){el.innerHTML='<div class="c"><div class="empty"><b>Search everything</b>Foods, exercises, sessions, meals you logged, day notes, plan weeks — and any date in YYYY-MM-DD form.</div></div>';return;}
  const foods=DB.foods.filter(f=>fMatch(f,q)).slice(0,8);
  const exs=DB.ex.filter(e=>e.name.toLowerCase().includes(q)).slice(0,6);
  const ent=[],wks=[],nts=[];
  Object.keys(DB.logs).sort().reverse().forEach(d=>{
    const L=DB.logs[d];
    (L.food||[]).forEach(f=>{if(f.name.toLowerCase().includes(q)&&ent.length<12)ent.push({d,f});});
    (L.work||[]).forEach(w=>{if(((w.name||'')+' '+sessionSets(w).map(s=>s.ex).join(' ')).toLowerCase().includes(q)&&wks.length<10)wks.push({d,w});});
    if(L.note&&L.note.toLowerCase().includes(q)&&nts.length<6)nts.push({d,n:L.note});
  });
  const pls=Object.entries(RUN).filter(([k,p])=>(p.n+' '+p.aim+' '+p.wk.map(x=>x.join(' ')).join(' ')).toLowerCase().includes(q));
  const dateHit=/^\d{4}-\d{2}-\d{2}$/.test(q)&&DB.logs[q]?q:null;
  const sec=(t,h)=>h?`<div class="lbl" style="margin:16px 4px 8px">${t}</div>${h}`:'';
  const body=
    (dateHit?`<div class="c"><div class="it" onclick="DAY='${dateHit}';go('diary')"><div class="m"><div class="t1">Open ${human(dateHit)}</div>
      <div class="t2">${fmt(dayTotals(dateHit).kcal,0,true)} kcal logged</div></div><div class="r" style="color:var(--pri)">›</div></div></div>`:'')
   +sec('Food database',foods.length?`<div class="c">${foods.map(f=>`<div class="it" onclick="shAddFood('Meal 1','${f.id}')">
      <div class="m"><div class="t1">${esc(f.name)}</div><div class="t2">${f.basis==='unit'?'per 1 '+esc(f.unit):'per 100 g'} · ${fmt(f.kcal,0)} kcal · ${fmt(f.pro,1)} g protein</div></div>
      <div class="r" style="color:var(--pri)">+</div></div>`).join('')}</div>`:'')
   +sec('Logged meals',ent.length?`<div class="c">${ent.map(x=>`<div class="it" onclick="DAY='${x.d}';go('diary')">
      <div class="m"><div class="t1">${esc(x.f.name)}</div><div class="t2">${human(x.d)} · ${x.f.meal}</div></div>
      <div class="r num">${fmt(x.f.kcal,0,true)}<small>kcal</small></div></div>`).join('')}</div>`:'')
   +sec('Sessions',wks.length?`<div class="c">${wks.map(x=>`<div class="it" onclick="DAY='${x.d}';go('diary')">
      <div class="m"><div class="t1">${esc(x.w.name)}</div><div class="t2">${human(x.d)} · ${x.w.type==='lift'?sessionCount(x.w)+' sets':fmt(x.w.min,0)+' min'}</div></div>
      <div class="r num">${fmt(x.w.kcal,0,true)}<small>kcal</small></div></div>`).join('')}</div>`:'')
   +sec('Exercises',exs.length?`<div class="c">${exs.map(e=>`<div class="it" onclick="go('diary');setTimeout(shLift,90)">
      <div class="m"><div class="t1">${esc(e.name)}</div><div class="t2">${e.pattern} · ${e.src||''} · used ${e.uses||0}×</div></div>
      <div class="r" style="color:var(--pri)">›</div></div>`).join('')}</div>`:'')
   +sec('Day notes',nts.length?`<div class="c">${nts.map(x=>`<div class="it" onclick="DAY='${x.d}';go('diary')">
      <div class="m"><div class="t1">${human(x.d)}</div><div class="t2" style="white-space:normal">${esc(x.n)}</div></div></div>`).join('')}</div>`:'')
   +sec('Plans',pls.length?`<div class="c">${pls.map(([k,p])=>`<div class="it" onclick="DB.plans.run='${k}';save();go('plans')">
      <div class="m"><div class="t1">${esc(p.n)}</div><div class="t2">${esc(p.len)} · ${esc(p.dist)}</div></div>
      <div class="r" style="color:var(--pri)">›</div></div>`).join('')}</div>`:'');
  el.innerHTML = body || `<div class="c"><div class="empty"><b>Nothing found</b>No match for “${esc(SQ)}”.
    <div style="margin-top:10px"><button class="b sm pri" onclick="shFood(null,${jsq(SQ)})">Add it as a food</button></div></div></div>`;
}

/* ------------------------------ SHELL --------------------------------- */
function sheet(title,html){
  $('#sheetBody').innerHTML=`<div class="sh-h"><h3>${title}</h3><span class="sp"></span>
    <button class="ib" onclick="closeSheet()" aria-label="Close">&times;</button></div>${html}`;
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('#sheet').classList.remove('on');$('#scrim').classList.remove('on');
  document.body.style.overflow='';
  if(restT){clearInterval(restT);restT=null;}
}
$('#scrim').onclick=closeSheet;
$('#btnMore').onclick=()=>{moreTab='settings';go('more');};
$('#btnTheme').onclick=()=>setTheme(DB.settings.theme==='dark'?'light':'dark');
$('#fab').onclick=()=>{
  if(VIEW==='food')shFood();
  else if(VIEW==='prog'&&progTab==='body')shScan();
  else if(VIEW==='more'&&moreTab==='spend')shExp();
  else if(VIEW==='more'&&moreTab==='remind')shRem();
  else if(DB.draft&&DB.draft.day===DAY)shLift();
  else shAddFood('Meal 1');
};
$('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-v="${k}" onclick="go('${k}')">${i}<span class="l">${l}</span></button>`).join('');
let qT=null;
$('#q').addEventListener('input',e=>{
  SQ=e.target.value;$('#qx').classList.toggle('on',!!SQ);
  clearTimeout(qT);
  qT=setTimeout(()=>{
    if(SQ.trim()){
      VIEW='search';CHARTS.length=0;
      $$('.view').forEach(x=>x.classList.remove('on'));
      $$('#nav button').forEach(x=>x.classList.remove('on'));
      $('#hTitle').textContent='Search';$('#hSub').textContent='Results for “'+SQ.trim()+'”';
      $('#v-search').classList.add('on');vSearch($('#v-search'));
    }else go('diary');
  },140);
});
$('#qx').onclick=()=>{$('#q').value='';SQ='';$('#qx').classList.remove('on');go('diary');};

(async function init(){
  const s=await Store.get();
  if(s&&(s.foods||s.days)){
    if(s.foods&&s.logs){
      DB=Object.assign(freshDB(),s);
      DB.settings=Object.assign(freshDB().settings,s.settings||{});
      DB.profile=Object.assign(freshDB().profile,s.profile||{});
      DB.plans=Object.assign({run:'p5k_race',gates:{}},s.plans||{});
      if(!DB.reminders||!DB.reminders.length)DB.reminders=JSON.parse(JSON.stringify(DEF_REM));
      DB.expenses=DB.expenses||[];DB.recents=DB.recents||[];
      DB.draft=s.draft||null;
      if(DB.draft&&(!DB.draft.ex||DB.draft.day<addDays(today(),-1)))DB.draft=null;
    }else{
      /* a Recomp Tracker v1 file found in storage — convert it once */
      const c=convertLegacy(s);
      DB=freshDB();
      c.foods.forEach(f=>DB.foods.push(f));
      DB.logs=c.logs;DB.expenses=c.expenses;
      if(s.profile){DB.profile.height=pn(s.profile.height,160);DB.profile.age=pn(s.profile.age,27);DB.profile.name=s.profile.name||'Ahmad';}
      toast('Old tracker data converted');
    }
  }
  document.documentElement.setAttribute('data-theme',DB.settings.theme||'light');
  document.querySelector('meta[name=theme-color]').setAttribute('content',DB.settings.theme==='dark'?'#0E1116':'#F2F4F8');
  await Store.set(DB);
  render();
  setInterval(checkRem,30000);checkRem();
  const t=targets();
  if(t.scan&&t.protein) setTimeout(()=>toast(`Calibrated from ${t.scan.src} ${humanY(t.scan.date)} — ${fmt(t.kcal,0,true)} kcal, ${fmt(t.protein.sweet,0)} g protein`),600);
})();
</script>
