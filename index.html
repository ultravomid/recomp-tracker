      <div class="f" style="margin:0"><label>Minutes</label>${numIn('cb_m'+ei,e.min||0,'min',5)}</div>
      <div class="f" style="margin:0"><label>Distance</label>${numIn('cb_d'+ei,e.dist||0,'km',0.5)}</div>
      <div class="f" style="margin:0"><label>Average HR</label>${numIn('cb_h'+ei,e.hr||0,'bpm',5)}</div>
      <div class="f" style="margin:0"><label>Calories</label>${numIn('cb_k'+ei,Math.round(e.kcal||0),'kcal',10)}</div>
    </div>
    <div class="tiny" style="padding:0 12px 11px">${e.met} MET · leave calories at zero to let it estimate, or paste the Garmin figure.</div>
  </div>`;
}
function liftBlockHTML(e,ei){
  const p=prevSets(e.name,DAY), c=e.ss?SSC[(e.ss-1)%SSC.length]:'', k=exKind(e), bw=curWeight();
  const cols = k==='time' ? ['Set','Prev','kg','Time','&#10003;']
             : k==='bw'   ? ['Set','Prev','+kg','Reps','&#10003;']
             :              ['Set','Prev','kg','Reps','&#10003;'];
  return `<div class="exb ${e.ss?'ssg':''}" style="${e.ss?`--ssc:${c}`:''}">
    <div class="exb-h"><div class="nm">${esc(e.name)}</div>
      <button class="mn" onclick="exMenu(${ei})">&#8942;</button></div>
    <div class="exb-meta">
      ${e.ss?`<span class="ss-tag" style="background:${c}">Superset ${String.fromCharCode(64+e.ss)}</span>`:''}
      <button class="rest-btn" onclick="exMenu(${ei})">Rest: ${e.rest?hhmmss(e.rest):'off'}</button>
      ${k==='time'?`<span class="tiny">${secFmt(exSeconds(e))} under tension</span>`
        :`<span class="tiny">${fmt(exVolume(e,bw),0,true)} kg volume</span>`}
      ${k==='bw'?`<span class="tiny">body ${fmt(bw,1)} kg</span>`:''}
    </div>
    <div class="kindbar">${[['wr','Weight &amp; reps'],['bw','Bodyweight'],['time','Time']].map(([kk,lb])=>
      `<button class="${k===kk?'on':''}" onclick="setKind(${ei},'${kk}')">${lb}</button>`).join('')}</div>
    ${e.note?`<div class="tiny" style="padding:0 12px 8px">${esc(e.note)}</div>`:''}
    <div class="sgrid hd ${k==='time'?'tm':''}">${cols.map(x=>`<span>${x}</span>`).join('')}</div>
    ${e.sets.map((s,si)=>{
      const ty=s.t||'N';
      const num=ty==='N'?(e.sets.slice(0,si+1).filter(x=>(x.t||'N')!=='W').length||si+1):ty;
      const second = k==='time'
        ? `<input class="tin" type="text" inputmode="numeric" value="${s.sec?secFmt(s.sec):''}"
             oninput="setVal(${ei},${si},'sec',this.value)" placeholder="${p&&p.sets[si]&&p.sets[si].sec?secFmt(p.sets[si].sec):'1:00'}">`
        : `<input type="text" inputmode="numeric" value="${s.rep===''||s.rep==null?'':fmt(s.rep,0)}"
             oninput="setVal(${ei},${si},'rep',this.value)" placeholder="${p&&p.sets[si]?fmt(p.sets[si].rep,0):'0'}">`;
      return `<div class="swp" data-del="set:${ei},${si}"><div class="swp-del">Delete</div>
        <div class="sgrid srow swp-in ${k==='time'?'tm':''} ${s.done?'done':''}" id="sr_${ei}_${si}">
        <button class="stype ${ty==='N'?'':ty}" onclick="cycleType(${ei},${si})" title="Warm-up, drop set, to failure">${num}</button>
        <div class="pv">${prevLabel(p,si,k)}</div>
        <input type="text" inputmode="decimal" value="${s.kg===''||s.kg==null?'':fmt(s.kg,s.kg%1?1:0)}"
          oninput="setVal(${ei},${si},'kg',this.value)" placeholder="${k==='bw'?'+0':(p&&p.sets[si]?fmt(p.sets[si].kg,0):'0')}">
        ${second}
        <button class="tick ${s.done?'on':''}" onclick="tickSet(${ei},${si})" aria-label="Mark done">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
      </div></div>`;}).join('')}
    <button class="exb-add" onclick="addSetRow(${ei})">+ Add set</button>
    <div class="swp-hint">Swipe a set left to delete it</div>
  </div>`;
}
function setKind(ei,k){
  const e=DB.draft.ex[ei];
  e.k2=k; if(k==='bw')e.bwkg=curWeight();
  e.sets.forEach(s=>{ if(k==='time'&&!pn(s.sec))s.sec=60; });
  save();redrawBody();
}
function cycleType(ei,si){
  const s=DB.draft.ex[ei].sets[si], order=['N','W','D','F'];
  s.t=order[(order.indexOf(s.t||'N')+1)%4];
  redrawBody();
}
function shPickCardio(){
  const ex=DB.ex.filter(e=>e.type==='cardio');
  sheet('Add a cardio block',`
    <p class="sub" style="margin-top:0">Finishing on the treadmill after lifting? Put it in the same session. Names come from Garmin Connect.</p>
    <div class="c" style="margin:0">${ex.map(e=>`<div class="it" onclick="pickCardio('${e.id}')">
      <div class="m"><div class="t1">${esc(e.name)}</div><div class="t2">${e.met} MET</div></div>
      <div class="r" style="color:var(--pri)">+</div></div>`).join('')}</div>`);
}
function pickCardio(id){
  const e=DB.ex.find(x=>x.id===id); if(!e)return;
  DB.draft.ex.push({exId:e.id,name:e.name,kind:'cardio',met:e.met,min:20,dist:0,hr:0,kcal:0});
  DB.draft.mode='full';save();closeSheet();drawLift();
}
/* read the cardio fields back, but only where the field is actually on screen and
   filled in — otherwise switching to Quick mode would blank the block on save */
function readCardioInputs(){
  (DB.draft.ex||[]).forEach((e,ei)=>{
    if(e.kind!=='cardio')return;
    const g=id=>{const el=document.getElementById(id+ei);
      return (el&&el.value!==''&&el.value!=null)?pn(el.value):null;};
    const m=g('cb_m'),d=g('cb_d'),hr=g('cb_h'),k=g('cb_k');
    if(m!=null)e.min=m; if(d!=null)e.dist=d; if(hr!=null)e.hr=hr; if(k!=null)e.kcal=k;
  });
}

function beep(){

    o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);

const MGROUPS=['Chest','Back','Shoulders','Arms','Legs','Core'];
function exGroup(name){
  const e=DB.ex.find(x=>x.name===name);
  return e&&MGROUPS.includes(e.pattern)?e.pattern:'Other';
}
function weeklySets(days){
  days=days||7;
  const out={};MGROUPS.forEach(g=>out[g]=0);out.Other=0;
  let sessions=0,tonnage=0;
  for(let i=0;i<days;i++){
    const d=addDays(today(),-i), L=DB.logs[d];
    if(!L)continue;
    (L.work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      if(sessionCount(w))sessions++;
      sessionEx(w).forEach(e=>{
        if(e.kind==='cardio')return;
        const g=exGroup(e.name);
        out[g]=(out[g]||0)+(e.sets||[]).filter(s=>(s.t||'N')!=='W').length;
        tonnage+=exVolume(e);
      });
    });
  }
  return {sets:out,sessions,tonnage};
}
/* the top set of each movement, session by session — is the load actually going up */
function movementHistory(){
  const by={};
  Object.keys(DB.logs).sort().forEach(d=>{
    (DB.logs[d].work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      sessionEx(w).forEach(e=>{
        if(e.kind==='cardio'||!e.sets||!e.sets.length)return;
        const key=exKind(e), score=s=>key==='time'?pn(s.sec):setVolume(e,s);
        const top=e.sets.reduce((a,s)=>(score(s)>score(a)?s:a),e.sets[0]);
        (by[e.name]=by[e.name]||[]).push({d,kg:top.kg||0,rep:top.rep||0,sec:top.sec||0,k2:key,
          load:setLoad(e,top),vol:key==='time'?exSeconds(e):exVolume(e)});
      });
    });
  });
  return by;
}

/* one composition tile carrying the change since the previous scan */
function tile(label,val,dec,unit,dir,prev,key){
  let d='';
  if(prev&&val!=null&&val!==''&&isFinite(val)&&prev[key]!=null&&prev[key]!==''&&isFinite(prev[key])){
    const df=val-prev[key];
    if(Math.abs(df)<Math.pow(10,-dec)/2) d='<span style="color:var(--ink3)">no change</span>';
    else{
      const good = dir==='higher' ? df>0 : df<0;
      d=`<span style="color:${good?'var(--ok)':'var(--warn)'};font-weight:600">${df>0?'▲ +':'▼ −'}${fmt(Math.abs(df),dec)}</span>`;
    }
  }
  const tone = key==='bf'?'var(--warn)' : (key==='lbm'||key==='musc')?'var(--pro)'
             : key==='vf'?(val>9?'var(--bad)':'var(--ok)') : '';
  const shown = (val==null||val===''||!isFinite(val))?'—':fmt(val,dec)+(unit==='%'?'%':'');
  return `<div class="st"><div class="k">${esc(label)}</div>
    <div class="v num"${tone?` style="color:${tone}"`:''}>${shown}</div>
    <div class="d">${d||esc(unit==='%'?'':unit)}</div></div>`;
}

function weeklyMovement(days){
  days=days||7;
  const out={aerobic:0,vigorous:0,zone2:0,km:0,byMode:{},perDay:[],dates:[],
    liftSessions:0,cardioSessions:0,mobilityDays:0,activeDays:0,steps:[],tonnage:0};
  const hm=DB.profile.hrmax||189, z2=[hm*0.6,hm*0.7];
  for(let i=days-1;i>=0;i--){
    const d=addDays(today(),-i), L=DB.logs[d];
    let dayMin=0;
    out.dates.push(human(d));
    if(L){
      if(L.steps)out.steps.push(L.steps);
      (L.work||[]).forEach(w=>{
        if(w.type==='lift'){out.liftSessions++;out.tonnage+=sessionVol(w);}
        const blocks = w.type==='cardio' ? [w] : cardioBlocks(w);
        blocks.forEach(c=>{
          const min=pn(c.min); if(min<=0)return;
          out.cardioSessions++;
          const mo=modeOf(c.name), met=pn(c.met)|| (DB.ex.find(x=>x.name===c.name)||{}).met || 5;
          out.byMode[mo]=(out.byMode[mo]||0)+min;
          out.km+=pn(c.dist);
          dayMin+=min;
          if(mo==='Mobility'){out.mobilityDays++;return;}
          if(met>=6)out.vigorous+=min; else out.aerobic+=min;
          if(c.hr&&c.hr>=z2[0]&&c.hr<=z2[1])out.zone2+=min;
          else if(!c.hr&&met<6)out.zone2+=min;
        });
      });
      if(dayMin>0||(L.steps||0)>=8000)out.activeDays++;
    }
    out.perDay.push(dayMin);
  }
  /* the guidelines count a vigorous minute as two moderate ones */
  out.equivalent=out.aerobic+out.vigorous*2;
  out.stepsAvg=out.steps.length?avg(out.steps):null;
  const v=weeklySets(days);
  out.setsByGroup=v.sets;
  out.minSets=Math.min(...MGROUPS.map(g=>v.sets[g]||0));
  return out;
}

    ['Sets on your thinnest muscle',M.minSets,10,16,'sets','No muscle should sit under 10 direct sets a week.'],
    ['Steps per day',M.stepsAvg,8000,10000,'','Most of the mortality benefit lands between 8,000 and 10,000 in younger adults (Paluch 2022).'],
    ['Days you moved',M.activeDays,5,7,'days','Frequency beats intensity for adherence. A short walk still counts.'],
    ['Mobility sessions',M.mobilityDays,2,3,'','Two to three days a week, per ACSM.']

  return `<div class="c">

/* ---- Progress → Training ---- */
function pgTrain(){
  const W=weeklySets(7), M=weeklySets(28), hist=movementHistory();
  const moveHTML=movementCard(false);
  const bar=(g)=>{
    const n=W.sets[g]||0, lo=10, hi=16, max=22;
    const tone = n===0?'var(--ink3)' : n<6?'var(--bad)' : n<lo?'var(--warn)' : n<=hi?'var(--ok)':'var(--warn)';
    const st = n===0?'nothing' : n<6?'far short' : n<lo?'light' : n<=hi?'in range':'high';
    return `<div style="margin-bottom:13px">
      <div class="row" style="margin-bottom:5px"><span class="mac-n">${g}</span><span class="sp" style="flex:1"></span>
        <span class="num" style="font-size:12px;color:${tone}">${fmt(n,0)} sets · ${st}</span></div>
      <div class="rb-t"><div class="rb-band" style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></div>
        <div class="rb-fill" style="width:${clamp(n/max*100,0,100)}%;background:${tone}"></div></div></div>`;
  };
  const names=Object.keys(hist).sort((a,b)=>hist[b].length-hist[a].length);
  const wkTon=[];for(let i=7;i>=0;i--){const s=addDays(today(),-i*7);let t=0;
    for(let j=0;j<7;j++){const d=addDays(s,j);if(d>today())continue;
      (DB.logs[d]?DB.logs[d].work||[]:[]).forEach(w=>{if(w.type==='lift')t+=sessionVol(w);});}
    wkTon.push(t);}
  return `
  ${moveHTML}
  <div class="c c-p">
    <div class="row" style="margin-bottom:12px"><div class="lbl">Direct sets per muscle · last 7 days</div></div>
    ${MGROUPS.map(bar).join('')}
    <div class="note">The green band is 10–16 sets a week, the range where added volume still buys growth before the returns flatten (Schoenfeld 2017, Pelland 2025). Only direct sets are counted — a bench press counts for chest, not for triceps — so the real figure for arms sits a little higher than what is drawn here.</div>
  </div>

  <div class="c c-p">
    <div class="g3">
      <div class="st"><div class="k">Sessions</div><div class="v num" style="color:${W.sessions>=3?'var(--ok)':'var(--warn)'}">${W.sessions}</div><div class="d">last 7 days · target 3–4</div></div>
      <div class="st"><div class="k">Tonnage</div><div class="v num">${fmt(W.tonnage,0,true)}</div><div class="d">kg lifted this week</div></div>
      <div class="st"><div class="k">Per month</div><div class="v num">${M.sessions}</div><div class="d">sessions in 28 days</div></div>
    </div>
  </div>

  <div class="c">
    <div class="ch-h"><span class="t">Weekly tonnage</span><span class="sp"></span><span class="a">kg lifted per week</span></div>
    <div class="ch-b">${chartHost({kind:'bar',data:wkTon,labels:wkTon.map((_,i)=>i===7?'now':'-'+(7-i)+'w'),dates:wkTon.map((_,i)=>'week ending '+human(addDays(today(),-(7-i)*7))),unit:'kg',color:'var(--pri)',h:150})}</div>
    <div class="c-p" style="padding-top:0"><div class="tiny">Tonnage is sets × reps × load. It should drift upward across a block; a fall while calories are low usually means recovery, not the program.</div></div>
  </div>

  <div class="c">
    <div class="c-h"><h2>Is the load going up</h2><span class="sp"></span><span class="tiny">${names.length} movements</span></div>
    ${names.length?names.slice(0,14).map(n=>{
      const h=hist[n], last=h[h.length-1], prev=h.length>1?h[h.length-2]:null;
      const dv=prev?last.vol-prev.vol:null;
      return `<div class="it"><div class="m"><div class="t1">${esc(n)}</div>
        <div class="t2 num">${humanY(last.d)} · top set ${fmt(last.kg,last.kg%1?1:0)} kg × ${fmt(last.rep,0)}${prev?' · was '+fmt(prev.kg,prev.kg%1?1:0)+' × '+fmt(prev.rep,0):''}</div></div>
        <div class="r num" style="color:${dv==null?'var(--ink3)':dv>0?'var(--ok)':dv<0?'var(--warn)':'var(--ink3)'}">${dv==null?'—':(dv>0?'+':'')+fmt(dv,0,true)}<small>kg volume</small></div></div>`;
    }).join('')
    :'<div class="empty"><b>No sets recorded yet</b>Log a session with the set table and this fills in on its own.</div>'}
    ${names.length?'<div class="c-p"><div class="note">One thing goes up every week: load, reps, or sets. If a lift falls twice in a row while sleep and calories are on target, that is under-recovery rather than a bad program.</div></div>':''}
  </div>`;
}

  const x=new Date((d||today())+'T12:00:00'), g=(x.getDay()+6)%7;  /* Monday first */
  return addDays(d||today(),-g);

function weekDays(ws){return Array.from({length:7},(_,i)=>addDays(ws,i));}
function planFor(dow){return (DB.week&&DB.week[dow])?DB.week[dow]:[];}
function planItems(d){

function isDone(d,id){const L=DB.logs[d];return !!(L&&L.done&&L.done[id]);}

/* did a session actually get logged, whatever the tick says */
function autoDone(d,it){
  const L=DB.logs[d]; if(!L)return false;
  const wk=L.work||[];
  if(it.type==='lift')return wk.some(w=>w.type==='lift');
  if(it.type==='run')return wk.some(w=>/run|jog|treadmill|walk/i.test(w.name));
  if(it.type==='cardio')return wk.some(w=>w.type==='cardio'||cardioBlocks(w).length);
  if(it.type==='rest')return wk.length===0;

function weekScore(ws){
  const days=weekDays(ws).filter(d=>d<=today());
  if(!days.length)return null;
  const t=targets();
  let planned=0,hit=0;
  days.forEach(d=>planItems(d).forEach(it=>{
    if(it.type==='rest')return;
    planned++; if(isDone(d,it.id)||autoDone(d,it))hit++;
  }));
  const logged=days.filter(d=>{const L=DB.logs[d];return L&&(L.food||[]).length;});
  const pro=logged.filter(d=>t.protein&&dayTotals(d).pro>=t.protein.floor).length;
  const kcal=logged.filter(d=>{const g=targets(d).kcal;return g&&Math.abs(dayTotals(d).kcal-g)<=200;}).length;
  const slp=days.filter(d=>{const L=DB.logs[d];return L&&L.sleep&&(L.sleep.min+(L.nap||0))>=420;}).length;
  const stp=days.filter(d=>{const L=DB.logs[d];return L&&L.steps>=t.steps[0];}).length;
  const lifts=days.filter(d=>(DB.logs[d]&&(DB.logs[d].work||[]).some(w=>w.type==='lift'))).length;
  const part=(n,d,w)=>d?Math.round(n/d*w):0;
  const parts=[
    ['Planned sessions done',part(hit,planned||1,30),30,planned?`${hit} of ${planned}`:'nothing planned'],
    ['Protein at the floor',part(pro,days.length,20),20,`${pro} of ${days.length} days`],
    ['Calories on target',part(kcal,days.length,15),15,`${kcal} of ${days.length} days`],
    ['Sleep 7 h or more',part(slp,days.length,15),15,`${slp} of ${days.length} days`],
    [`${fmt(t.steps[0],0,true)} steps`,part(stp,days.length,10),10,`${stp} of ${days.length} days`],
    [`${t.lifts} lifting days`,part(Math.min(lifts,t.lifts),t.lifts,10),10,`${lifts} sessions`]
  ];
  const score=sum(parts,p=>p[1]);
  return {ws,days:days.length,score,parts,planned,hit,lifts,
    grade: score>=85?'Excellent':score>=70?'Solid':score>=55?'Patchy':'Off the rails'};
}
/* ---- phases generated from the date you actually started, not a fixed table ---- */
function phaseBlocks(){
  const t=targets(), start=DB.settings.phaseStart||today();
  const rate = (t.T&&t.T.mRate&&!t.T.suspect&&t.T.mRate>0.1) ? t.T.mRate
             : (t.master&&t.rateGoal?t.rateGoal:(t.rate?avg(t.rate):0.55));
  let w=curWeight(), d=start, out=[], i=0, tdee=t.tdee||2300;
  const targetW=65;
  while(i<14&&w>targetW){
    const cutW = w>25? 8 : 8;
    const ph = w>72?'cut20':w>67?'cut20':'cut15';
    const wEnd=Math.max(targetW,w-rate*cutW);
    out.push({from:d,to:addDays(d,cutW*7-1),kind:'Cut',phase:ph,w0:w,w1:wEnd,weeks:cutW,
      kcal:tdee*PHASES[ph].m});
    d=addDays(d,cutW*7); w=wEnd;
    if(w<=targetW)break;
    out.push({from:d,to:addDays(d,13),kind:'Diet break',phase:'maint',w0:w,w1:w,weeks:2,kcal:tdee});
    d=addDays(d,14);
    tdee=Math.max(1800,tdee-25*(rate*cutW));   /* maintenance falls with body mass */
    i++;
  }
  out.push({from:d,to:addDays(d,27),kind:'Reassess',phase:'maint',w0:w,w1:w,weeks:4,kcal:tdee});
  return out;
}
function currentBlock(){const b=phaseBlocks();return b.find(x=>today()>=x.from&&today()<=x.to)||b[0];}
/* ---- which split the last eight weeks say you can actually keep ---- */
function realDaysPerWeek(){
  const wk=[];
  for(let w=0;w<8;w++){
    let n=0;
    for(let i=0;i<7;i++){const d=addDays(today(),-(w*7+i));
      if(DB.logs[d]&&(DB.logs[d].work||[]).some(x=>x.type==='lift'))n++;}
    wk.push(n);
  }
  const used=wk.filter((v,i)=>i<4||v>0);
  return {avg:avg(used)||0,weeks:wk};
}

/* every plan item that asks for a reminder gets one, and only one */
function syncPlanReminders(){
  DB.reminders=(DB.reminders||[]).filter(r=>!r.plan);
  for(let dow=0;dow<7;dow++){
    planFor(dow).forEach(it=>{
      if(!it.remind||!it.time)return;
      const jsDay=(dow+1)%7;
      const ex=DB.reminders.find(r=>r.plan===it.id);
      if(ex){if(!ex.d.includes(jsDay))ex.d.push(jsDay);ex.t=it.time;}
      else DB.reminders.push({id:uid(),plan:it.id,t:it.time,
        n:it.title+(it.who?' — '+it.who:''),d:[jsDay],on:true});
    });
  }
  /* a gym session earns a pre-workout nudge an hour ahead */
  for(let dow=0;dow<7;dow++){
    planFor(dow).forEach(it=>{
      if(it.type!=='lift'||!it.remind||!it.time)return;
      const [hh,mm]=it.time.split(':').map(Number);
      let m=hh*60+mm-60; if(m<0)m+=1440;
      const t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
      DB.reminders.push({id:uid(),plan:it.id+'_pwo',t,n:'Pre-workout — carbs now, caffeine if it is before 14:00',
        d:[(dow+1)%7],on:true});
    });
  }
}

  if(/shoulder|lateral|overhead press|arnold|face pull|rear delt|upright/.test(s))return 'Shoulders';
  if(/curl|tricep|skullcrusher|pushdown/.test(s))return 'Arms';
  if(/squat|leg|lunge|calf|glute|hip|hamstring|tibialis|split/.test(s))return 'Legs';

    <div class="empty" style="padding:16px 8px"><b>Nothing with a distance yet</b>Log a walk or a run with kilometres and the weekly load, the pace and your shoe mileage all start filling in.</div></div>`;
  const wk=[];for(let i=7;i>=0;i--){const s=addDays(today(),-i*7);let km=0;
    for(let j=0;j<7;j++){const d=addDays(s,j);if(d>today())continue;runs.filter(r=>r.d===d).forEach(r=>km+=r.km);}
    wk.push(km);}
  const thisWk=wk[7], lastWk=wk[6];
  const jump=lastWk>0?(thisWk-lastWk)/lastWk*100:null;
  const last=runs[runs.length-1];
  const pace=last.min&&last.km?last.min/last.km:null;
  return `<div class="c">
    <div class="ch-h"><span class="t">Weekly distance</span><span class="sp"></span><span class="a">${fmt(thisWk,1)} km this week</span></div>
    <div class="ch-b">${chartHost({kind:'bar',data:wk,labels:wk.map((_,i)=>i===7?'now':'-'+(7-i)+'w'),
      dates:wk.map((_,i)=>'week ending '+human(addDays(today(),-(7-i)*7))),unit:'km',dec:1,color:'var(--pro)',h:150})}</div>

        <div class="st"><div class="k">Week on week</div><div class="v num" style="color:${jump==null?'':jump>10?'var(--warn)':'var(--ok)'}">${jump==null?'—':(jump>0?'+':'')+fmt(jump,0)+'%'}</div><div class="d">volume change</div></div>
      </div>
      ${jump!=null&&jump>10?`<div class="note wa" style="margin-top:11px">Volume is up ${fmt(jump,0)}% on last week. Sudden jumps in training load are the largest modifiable injury risk in new runners (Nielsen 2014); roughly 10% a week is the ceiling worth holding to, and at 81 kg with a shin history that ceiling is not optional.</div>`
       :`<div class="note" style="margin-top:11px">Keep weekly increases near 10%. Ground reaction force in running is about 2.5× body weight per step, so every kilogram you lose takes roughly 2.5 kg off each landing — losing weight is itself an injury intervention.</div>`}
    </div></div>`;
}

function plPhase(){
  const t=targets(), blocks=phaseBlocks(), cur=currentBlock();
  const rate=(t.T&&t.T.mRate&&!t.T.suspect&&t.T.mRate>0.1)?t.T.mRate:(t.rate?avg(t.rate):0.55);
  const done=cur?Math.max(0,dayDiff(cur.from,today())):0, len=cur?dayDiff(cur.from,cur.to)+1:1;
  return `
  <div class="c">
    <div class="c-h"><h2>Where you are</h2><span class="sp"></span><span class="flag in">${esc(cur?cur.kind:'—')}</span></div>
    <div class="c-p" style="padding-top:11px">
      ${cur?`${rangeBar({label:cur.kind+' block',value:clamp(done,0,len),unit:'days',min:0,max:len,
        band:[0,len],ticks:[len],
        legend:[{k:'Started',v:human(cur.from)},{k:'Day',v:`${clamp(done,0,len)} of ${len}`,hi:1},{k:'Ends',v:human(cur.to)}],
        note:`Target for this block: ${fmt(cur.kcal,0,true)} kcal a day, ${fmt(cur.w0,1)} → ${fmt(cur.w1,1)} kg.`,color:'var(--pri)'})}`:''}
      <div class="g3" style="margin-top:4px">
        <div class="st"><div class="k">Measured rate</div><div class="v num">${fmt(rate,2)}</div><div class="d">kg/week${t.T&&t.T.mRate&&!t.T.suspect?'':' · assumed'}</div></div>
        <div class="st"><div class="k">Now</div><div class="v num">${fmt(curWeight(),1)}</div><div class="d">kg, 7-day average</div></div>
        <div class="st"><div class="k">65 kg by</div><div class="v num" style="font-size:15px">${(()=>{const b=blocks.find(x=>x.w1<=65.05);return b?human(b.to):'beyond this map';})()}</div><div class="d">at this rate</div></div>
      </div>
      <div class="brow" style="margin-top:12px">
        <button class="b sm" onclick="shPhaseStart()">Set the start date</button>
        <button class="b sm" onclick="DB.settings.phaseStart=today();save();render();toast('Block restarted today')">Restart here</button>
      </div>
    </div>
  </div>
  <div class="c">
    <div class="c-h"><h2>Projected blocks</h2><span class="sp"></span><span class="tiny">from your own rate</span></div>
    <div class="c-p" style="padding-top:10px"><table class="tb"><tr><th>Block</th><th>kcal</th><th>Weight</th></tr>
      ${blocks.map(b=>`<tr style="${b===cur?'background:var(--pri-soft)':''}">
        <td>${human(b.from)} – ${human(b.to)}<div style="color:var(--ink3);font-size:11.5px">${b.kind} · ${b.weeks} weeks</div></td>
        <td class="num">${fmt(b.kcal,0,true)}</td>
        <td class="num">${fmt(b.w0,1)}${b.w1!==b.w0?' → '+fmt(b.w1,1):''}</td></tr>`).join('')}
    </table>
    <div class="note" style="margin-top:11px">This is generated from the date you started and the rate your own weight trend is showing, so it moves when you do — it is not a fixed table. Maintenance is stepped down as body mass falls, which is why the calorie column drifts rather than holding still.</div>
    <div class="note" style="margin-top:9px">Eight weeks of deficit, two at maintenance, repeated. In MATADOR that pattern produced 12.3 kg of fat lost against 8.0 kg on continuous dieting across the same total deficit time. The break is part of the plan, not a pause from it.</div>
    </div>
  </div>`;
}
function shPhaseStart(){
  sheet('Block start',`<div class="f"><label>This deficit block began on</label>
      <input class="in" id="ps_d" type="date" value="${DB.settings.phaseStart||today()}"></div>
    <button class="b pri full" onclick="DB.settings.phaseStart=$('#ps_d').value||today();save();closeSheet();render()">Save</button>

}

/* ---- minimal ZIP writer (stored, no compression) so "export everything" is a
   single download; browsers, and iOS Safari in particular, block a burst of them ---- */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipFiles(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  files.forEach(f=>{
    const data=enc.encode(f.data), nm=enc.encode(f.name), crc=crc32(data);
    const lh=new Uint8Array(30+nm.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,0,true);lv.setUint16(12,0,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);
    lv.setUint16(26,nm.length,true);lv.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+nm.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,nm.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(nm,46);cen.push(ch);
    off+=lh.length+data.length;
  });
  const cenSize=cen.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  return new Blob([...parts,...cen,end],{type:'application/zip'});
}

function convertLegacy(o){
  const out={foods:[],logs:{},scans:[],expenses:[],reminders:null};
  (o.customFoods||[]).forEach(f=>{
    const nm=f.nm||f.n; if(!nm)return;
    out.foods.push({id:uid(),name:nm,alias:'',cat:'Custom',basis:'g',unit:'serving',unitG:100,
      kcal:pn(f.cal!==undefined?f.cal:f.c),pro:pn(f.p),carb:pn(f.c!==undefined&&f.cal!==undefined?f.c:f.cb),
      fat:pn(f.f),fib:pn(f.fib),sod:pn(f.na),fav:0,uses:0});
  });
  Object.keys(o.days||{}).forEach(d=>{
    const od=o.days[d]||{}, src=od.foods||od.food||[], acts=od.activities||od.activity||[];
    out.logs[d]={
      food:src.map(f=>{const nm=f.nm||f.n||'Food', kc=pn(f.cal!==undefined?f.cal:f.c);
        return {id:uid(),foodId:null,name:nm,qty:1,mode:'unit',unitLb:'serving',meal:'Meal 1',
          kcal:kc,pro:pn(f.p),carb:pn(f.cal!==undefined?f.c:f.cb),fat:pn(f.f),fib:pn(f.fib),sod:pn(f.na)};}),
      work:acts.map(a=>({id:uid(),type:'cardio',name:a.nm||a.n||'Session',min:pn(a.mins),
        dist:pn(a.km),hr:0,kcal:pn(a.cal!==undefined?a.cal:a.c)})),
      water:pn(od.water),sleep:null,steps:pn(od.steps)||(acts.reduce((s,a)=>s+pn(a.steps!==undefined?a.steps:a.s),0)||null),
      weight:od.weight!=null?pn(od.weight):null,waist:od.waist!=null?pn(od.waist):null,note:''};
  });
  (o.expenses||[]).forEach(e=>out.expenses.push({id:e.id||uid(),n:e.n||e.nm||'Expense',
    amt:pn(e.amt!==undefined?e.amt:e.amount),d:e.d||e.date||today(),
    cat:({Makanan:'Food',Suplemen:'Supplements',Gym:'Gym',Peralatan:'Gear',Lainnya:'Other'})[e.cat]||e.cat||'Other'}));
  return out;
}
function doImport(mode){
  const o=window._imp; if(!o)return;
  const isV2=!!o.logs&&!!o.foods&&!!o.meta;
  if(isV2&&mode==='replace'){DB=Object.assign(freshDB(),o);}
  else{
    const c = isV2 ? {foods:o.foods,logs:o.logs,scans:o.scans||[],expenses:o.expenses||[],reminders:o.reminders} : convertLegacy(o);
    if(mode==='replace'){DB=freshDB();DB.foods=[];DB.logs={};}
    const names=new Set(DB.foods.map(f=>f.name.toLowerCase()));
    (c.foods||[]).forEach(f=>{if(!names.has(String(f.name).toLowerCase())){DB.foods.push({...f,id:uid()});names.add(String(f.name).toLowerCase());}});
    Object.keys(c.logs||{}).forEach(d=>{if(!DB.logs[d]||mode==='replace')DB.logs[d]=c.logs[d];});
    const sk=new Set(DB.scans.map(s=>s.date+s.time));
    (c.scans||[]).forEach(s=>{if(!sk.has(s.date+s.time))DB.scans.push({...s,id:uid()});});
    const ek=new Set(DB.expenses.map(e=>e.id));
    (c.expenses||[]).forEach(e=>{if(!ek.has(e.id))DB.expenses.push(e);});
    if(c.reminders&&c.reminders.length&&mode==='replace')DB.reminders=c.reminders;
  }
  normalizeDB();pruneLogs();save();closeSheet();render();toast('Import finished');
}

function buildRows(kind){
  let rows=[];
  if(kind==='foods'){
    rows.push(['name','alias','category','measured_in','basis','unit','unit_amount','calories','protein','carbs','fat','fiber','sodium','total_sugar','free_sugar']);
    DB.foods.forEach(f=>rows.push([f.name,f.alias,f.cat,unitOf(f),f.basis,f.unit,f.unitG,f.kcal,f.pro,f.carb,f.fat,f.fib,f.sod,f.sug||0,f.sugF||0]));
  }else if(kind==='scans'){
    rows.push(['date','time','device','weight_kg','body_fat_pct','lean_mass_kg','fat_mass_kg','visceral','muscle_pct','body_age','resting_kcal','bmi','waist_cm','note']);
    [...DB.scans].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{const d=scanDerived(s);
      rows.push([s.date,s.time,s.src,s.weight,s.bf,d.lbm?d.lbm.toFixed(2):'',d.fatMass?d.fatMass.toFixed(2):'',s.vf,s.musc,s.bodyAge,s.rmr,s.bmi,s.waist,s.note]);});
  }else if(kind==='workouts'){
    rows.push(['date','type','name','minutes','distance_km','avg_hr','sets','volume_kg','calories']);
    Object.keys(DB.logs).sort().forEach(d=>(DB.logs[d].work||[]).forEach(w=>
      rows.push([d,w.type,w.name,w.min||'',w.dist||'',w.hr||'',sessionCount(w),sessionVol(w)?sessionVol(w).toFixed(0):'',Math.round(w.kcal||0)])));
  }else if(kind==='sets'){
    rows.push(['date','session','exercise','logged_as','set_number','set_type','weight_kg','bodyweight_kg','reps','seconds','rir','volume_kg']);
    Object.keys(DB.logs).sort().forEach(d=>(DB.logs[d].work||[]).forEach(w=>{
      if(w.type!=='lift')return;
      sessionEx(w).forEach(e=>{
        if(e.kind==='cardio')return;
        const k=exKind(e);
        (e.sets||[]).forEach((s,i)=>rows.push([d,w.name,e.name,k,i+1,s.t||'N',s.kg||0,
          k==='bw'?(e.bwkg||''):'',s.rep||0,s.sec||0,s.rir,setVolume(e,s).toFixed(0)]));});}));
  }else if(kind==='expenses'){
    rows.push(['date','item','category','amount_idr']);
    [...DB.expenses].sort((a,b)=>String(a.d).localeCompare(String(b.d))).forEach(e=>rows.push([e.d,e.n,e.cat,e.amt]));
  }else if(kind==='labs'){
    rows.push(['date',...LABS.map(x=>x[0]),'note']);
    [...(DB.labs||[])].sort((a,b)=>a.date.localeCompare(b.date))
      .forEach(l=>rows.push([l.date,...LABS.map(x=>l[x[0]]!=null?l[x[0]]:''),l.note||'']));
  }else if(kind==='metrics'){
    rows.push(['date','vo2max','hrv_ms','resting_hr','body_battery']);
    [...(DB.metrics||[])].sort((a,b)=>a.date.localeCompare(b.date))
      .forEach(m=>rows.push([m.date,m.vo2||'',m.hrv||'',m.rhr||'',m.bb||'']));
  }else if(kind==='gear'){
    rows.push(['name','type','bought','km','retire_at','cost_idr','retired']);
    (DB.gear||[]).forEach(g=>rows.push([g.name,g.type,g.bought||'',g.km||0,g.limit||'',g.cost||0,g.retired?'yes':'no']));
  }else if(kind==='plan'){
    rows.push(['day','type','title','time','with','detail','reminder']);
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach((d,i)=>
      planFor(i).forEach(it=>rows.push([d,it.type,it.title,it.time||'',it.who||'',it.detail||'',it.remind?'yes':'no'])));
  }else if(kind==='exercises'){
    rows.push(['name','type','group','met','source','times_used']);
    DB.ex.forEach(e=>rows.push([e.name,e.type,e.pattern,e.met,e.src||'',e.uses||0]));
  }else{
    rows.push(['date','calories','protein_g','carbs_g','fat_g','fiber_g','sodium_mg','total_sugar_g','free_sugar_g','water_ml','sleep_min','sleep_quality','steps','training_kcal','training_min','weight_kg','waist_cm','note']);
    Object.keys(DB.logs).sort().forEach(d=>{const L=DB.logs[d],z=dayTotals(d);
      rows.push([d,z.kcal.toFixed(0),z.pro.toFixed(1),z.carb.toFixed(1),z.fat.toFixed(1),z.fib.toFixed(1),z.sod.toFixed(0),
        z.sug.toFixed(1),z.sugF.toFixed(1),L.water||0,L.sleep?L.sleep.min:'',L.sleep?L.sleep.q:'',L.steps||'',
        z.burn.toFixed(0),z.min,L.weight||'',L.waist||'',L.note||'']);});
  }
  return rows;
}
function impCSV(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{
    const lines=r.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast('That file looks empty');return;}
    const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){o.push(c);c='';}else c+=ch;}o.push(c);return o;};
    const H=sp(lines[0]).map(h=>h.trim().toLowerCase());
    const ix=(...ks)=>{for(const k of ks){const i=H.findIndex(h=>h===k||h.includes(k));if(i>=0)return i;}return -1;};
    const I={n:ix('name','food','description'),k:ix('calories','energy','kcal'),p:ix('protein'),
      c:ix('carbohydrate','carbs','carb'),f:ix('fat'),fb:ix('fiber','fibre'),s:ix('sodium'),
      u:ix('unit'),ug:ix('unit_amount','unit_grams','grams','serving'),
      sg:ix('total_sugar','sugars','sugar'),sf:ix('free_sugar','added_sugar'),ms:ix('measured_in','measure')};
    if(I.n<0||I.k<0){toast('Needs at least a name and a calories column');return;}
    let n=0;
    lines.slice(1).forEach(l=>{
      const c=sp(l), nm=(c[I.n]||'').trim(); if(!nm)return;
      DB.foods.push({id:uid(),name:nm,alias:'',cat:'Custom',basis:'g',
        msr:(I.ms>=0&&/ml/i.test(c[I.ms]||''))?'ml':'g',
        unit:(I.u>=0&&c[I.u])?c[I.u].trim():'serving',unitG:I.ug>=0?pn(c[I.ug],100):100,
        kcal:pn(c[I.k]),pro:I.p>=0?pn(c[I.p]):0,carb:I.c>=0?pn(c[I.c]):0,fat:I.f>=0?pn(c[I.f]):0,
        fib:I.fb>=0?pn(c[I.fb]):0,sod:I.s>=0?pn(c[I.s]):0,
        sug:I.sg>=0?pn(c[I.sg]):0,sugF:I.sf>=0?pn(c[I.sf]):(I.sg>=0?pn(c[I.sg]):0),fav:0,uses:0});
      n++;
    });
    save();render();toast(n+' foods imported');
  };
  r.readAsText(f); inp.value='';
}

  routine:id=>{DB.plans.routines=(DB.plans.routines||[]).filter(r=>r.id!==id);save();render();toast('Routine deleted');},
  scan:id=>{if(DB.scans.length<2){toast('Keep at least one scan');return;}
    DB.scans=DB.scans.filter(s=>s.id!==id);save();render();toast('Scan deleted');}
};
function swipeRow(key,inner){
  return `<div class="swp" data-del="${esc(key)}"><div class="swp-del">Delete</div>${inner}</div>`;
}
function closeSwipes(except){$$('.swp.open').forEach(el=>{if(el!==except)el.classList.remove('open');});}
function runDel(key){
  const i=String(key).indexOf(':');
  const fn=DEL_ACTIONS[String(key).slice(0,i)];
  if(fn)fn(String(key).slice(i+1));
}
function bindSwipe(){
  $$('.swp').forEach(el=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    const inner=el.querySelector('.swp-in'), del=el.querySelector('.swp-del');
    if(!inner||!del)return;
    let x0=0,y0=0,dx=0,axis=null,down=false;
    const OPEN=96;
    const setX=v=>{inner.style.transition='none';inner.style.transform=`translateX(${v}px)`;};
    const release=()=>{inner.style.transition='';inner.style.transform='';};
    del.addEventListener('click',ev=>{ev.stopPropagation();runDel(el.dataset.del);});
    inner.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      down=true;axis=null;dx=0;x0=e.clientX;y0=e.clientY;el._moved=false;
    });
    inner.addEventListener('pointermove',e=>{
      if(!down)return;
      const mx=e.clientX-x0, my=e.clientY-y0;
      if(!axis){
        if(Math.abs(mx)<6&&Math.abs(my)<6)return;
        axis=Math.abs(mx)>Math.abs(my)?'x':'y';
        if(axis==='x'){closeSwipes(el);try{inner.setPointerCapture(e.pointerId);}catch(_){}}
      }
      if(axis!=='x')return;
      el._moved=true;
      const base=el.classList.contains('open')?-OPEN:0;
      dx=clamp(base+mx,-OPEN-24,0);
      setX(dx);
    });
    const finish=()=>{
      if(!down)return; down=false;
      if(axis==='x'){release();el.classList.toggle('open',dx<-OPEN/2);setTimeout(()=>{el._moved=false;},80);}
      axis=null;
    };
    ['pointerup','pointercancel','pointerleave'].forEach(t=>inner.addEventListener(t,finish));
    inner.addEventListener('click',e=>{
      if(el._moved||el.classList.contains('open')){
        e.stopPropagation();e.preventDefault();el.classList.remove('open');
      }
    },true);
  });
}
document.addEventListener('pointerdown',e=>{
  const s=(e.target&&e.target.closest)?e.target.closest('.swp'):null;
  if(!s)closeSwipes(null);
},true);

(async function init(){
  const s=await Store.get();
  if(s&&(s.foods||s.days)){
    if(s.foods&&s.logs){
      DB=Object.assign(freshDB(),s);
      DB.settings=Object.assign(freshDB().settings,s.settings||{});
      DB.profile=Object.assign(freshDB().profile,s.profile||{});
      DB.plans=Object.assign({run:'p5k_race',gates:{}},s.plans||{});
      if(!DB.reminders||!DB.reminders.length)DB.reminders=JSON.parse(JSON.stringify(DEF_REM));
      DB.expenses=DB.expenses||[];DB.recents=DB.recents||[];
      DB.draft=s.draft||null;
      DB.week=s.week||{};DB.labs=s.labs||[];DB.metrics=s.metrics||[];DB.gear=s.gear||[];
      DB.plans.steps=DB.plans.steps||{};DB.plans.routines=DB.plans.routines||[];
      if(!DB.settings.foodCats||!DB.settings.foodCats.length)DB.settings.foodCats=freshDB().settings.foodCats;
      if(!DB.settings.meals||!DB.settings.meals.length)DB.settings.meals=DEF_MEALS.slice();
      if(!DB.settings.phaseStart)DB.settings.phaseStart=today();
      if(!DB.settings.split)DB.settings.split='ul3';
      /* meal names follow the master schedule; old names are mapped, never dropped */
      DB.foods.forEach(f=>{if(f.sug==null)f.sug=0;if(f.sugF==null)f.sugF=0;
        if(!f.msr)f.msr=/drink|minuman|milk|susu|juice|jus|tea|teh|coffee|kopi|water|air kelapa/i
          .test(f.name+' '+(f.alias||''))?'ml':'g';});
      if(DB.draft&&(!DB.draft.ex||DB.draft.day<addDays(today(),-1)))DB.draft=null;
    }else{
      /* a Recomp Tracker v1 file found in storage — convert it once */
      const c=convertLegacy(s);
      DB=freshDB();
      c.foods.forEach(f=>DB.foods.push(f));
      DB.logs=c.logs;DB.expenses=c.expenses;
      if(s.profile){DB.profile.height=pn(s.profile.height,160);DB.profile.age=pn(s.profile.age,27);DB.profile.name=s.profile.name||'Ahmad';}
      toast('Old tracker data converted');
    }
  }
  normalizeDB();
  document.documentElement.setAttribute('data-theme',DB.settings.theme||'light');
  document.documentElement.setAttribute('data-accent',DB.settings.accent||'glass');
  syncThemeColor();
  await Store.set(DB);
  render();
  let _hs=false; try{_hs=/^#scan=/.test(location.hash||'');}catch(e){}
  if((DB.meta.master||0)<MASTER_V&&!_hs)setTimeout(shMasterUpdate,650);
  scanFromHash(); window.addEventListener('hashchange',scanFromHash);
  setInterval(checkRem,30000);checkRem();
  const t=targets();
  if(t.scan&&t.protein&&(DB.meta.master||0)>=MASTER_V) setTimeout(()=>toast(`Calibrated from ${t.scan.src} ${humanY(t.scan.date)} — ${fmt(t.kcal,0,true)} kcal, ${fmt(t.protein.sweet,0)} g protein`),600);
})();
</script>
